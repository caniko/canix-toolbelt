[package]
name = "canix-toolbelt"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Reusable runtime-manifest library and CLI for Canix-style architectures"
license = "MIT"
repository = "https://github.com/caniko/canix-toolbelt"
homepage = "https://canix-toolbelt.tartanoglu.com"
documentation = "https://docs.rs/canix-toolbelt"
readme = "RUST.md"
keywords = ["nixos", "runtime", "pkl", "configuration"]
categories = ["config", "command-line-utilities"]
include = [
  "/src/**",
  "/tests/**",
  "!/tests/**/__pycache__/**",
  "!/tests/**/*.pyc",
  "/examples/**",
  "/runtime/ReviewPolicy.pkl",
  "/RUST.md",
  "/BUILD_TRAIN.md",
  "/DIRECT_NETWORK.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/Cargo.toml",
  "/Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
cli = ["dep:clap", "dep:signal-hook", "review"]
review = ["dep:ureq", "dep:sha2", "dep:fs2", "dep:url", "dep:chrono", "dep:zeroize", "rustix/net"]
build-train = ["fleetix/build-train-cli"]
direct-network = ["rustix/net", "rustix/process"]

[[bin]]
name = "canix-toolbelt"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "canix-toolbelt-direct-network"
path = "src/bin/direct-network.rs"
required-features = ["cli", "direct-network"]

[dependencies]
fleetix = { version = "0.6.0", default-features = false, features = ["pkl"] }
miette = "7"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
signal-hook = { version = "0.4", optional = true }
ureq = { version = "3", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
fs2 = { version = "0.4", optional = true }
url = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
