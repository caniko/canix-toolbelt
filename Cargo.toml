[package]
name = "canix-toolbelt"
version = "0.12.0"
edition = "2021"
rust-version = "1.88"
description = "Reusable runtime-manifest library and CLI for Canix-style architectures"
license = "MIT"
repository = "https://github.com/caniko/canix-toolbelt"
homepage = "https://canix-toolbelt.tartanoglu.com"
documentation = "https://docs.rs/canix-toolbelt"
readme = "RUST.md"
keywords = ["nixos", "runtime", "pkl", "configuration"]
categories = ["config", "command-line-utilities"]
include = [
  "/src/**",
  "/tests/**",
  "!/tests/**/__pycache__/**",
  "!/tests/**/*.pyc",
  "/examples/**",
  "/runtime/ReviewPolicy.pkl",
  "/runtime/execution/**",
  "/scripts/generate-execution-protocol.py",
  "/EXECUTION_PROTOCOL.md",
  "/RUST.md",
  "/simit.toml",
  "/.github/workflows/ci.yaml",
  "/.github/workflows/nix-builds.yaml",
  "/BUILD_TRAIN.md",
  "/DIRECT_NETWORK.md",
  "/docs/direct-network.md",
  "/ORCHESTRATION.md",
  "/CHANGELOG.md",
  "/docs/qualification.md",
  "/LICENSE",
  "/Cargo.toml",
  "/Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
fallible_impl_from = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
allow_attributes_without_reason = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# Ratchet: 23 functions exceed Clippy's line limit with all targets and features on Linux.
too_many_lines = "allow"
# Ratchet: The GPU memory ratio intentionally converts two byte counts to f64.
cast_precision_loss = "allow"

[features]
default = []
cli = ["dep:clap", "dep:signal-hook", "review", "qualification-cli", "caddy-plugins"]
attic = ["dep:anyhow", "dep:harbor-cache", "dep:nix-manager-core", "dep:toml_edit"]
browser-gpu-guard = ["dep:clap", "dep:nix", "nix/poll", "rustix/process"]
caddy-plugins = ["dep:rnix", "dep:rowan", "dep:ureq"]
review = ["dep:ureq", "dep:sha2", "dep:fs2", "dep:url", "dep:chrono", "dep:zeroize", "rustix/net"]
build-train = ["fleetix/build-train-cli"]
direct-network = ["rustix/event", "rustix/net", "rustix/process", "dep:nix"]
orchestration = ["dep:sha2", "dep:fs2", "dep:chrono", "dep:tempfile"]
qualification = ["dep:sha2", "dep:tar", "rustix/process"]
qualification-cli = ["qualification", "dep:clap"]

[[bin]]
name = "canix-toolbelt"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "canix-toolbelt-direct-network"
path = "src/bin/direct-network.rs"
required-features = ["cli", "direct-network"]

[[bin]]
name = "browser-gpu-guard"
path = "src/bin/browser-gpu-guard.rs"
required-features = ["browser-gpu-guard"]

[[example]]
name = "orchestration_shadow"
required-features = ["orchestration"]

[dependencies]
fleetix = { version = "0.16.0", default-features = false }
pklx = { version = "0.2.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
miette = "7"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
nix = { version = "0.31", features = ["user"], optional = true }
signal-hook = { version = "0.4", optional = true }
ureq = { version = "3", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
fs2 = { version = "0.4", optional = true }
url = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
zeroize = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
anyhow = { version = "1", optional = true }
harbor-cache = { version = "0.1.1", optional = true }
toml_edit = { version = "0.22", optional = true }
rnix = { version = "0.12", optional = true }
rowan = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
nix-manager-core = { version = "0.4.9", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
