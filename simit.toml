[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
components = ["flake-evaluation"]
nix_builds = [
  ".#opencode-browser-adapter",
  ".#checks.x86_64-linux.browser-connection-eval",
  ".#checks.x86_64-linux.browser-connection-runtime",
  ".#checks.x86_64-linux.browser-connection-smoke",
  ".#checks.x86_64-linux.harbor-db-compat-eval",
  ".#checks.x86_64-linux.harbor-db-compat-runtime",
  ".#checks.x86_64-linux.dns-publication-eval",
]
with_msrv = true
with_audit = true
with_docs = true
publish_crates = true
extra_env= { RUSTDOCFLAGS = "-D warnings" }
# Full flake checks include NixOS guests. Require hosted KVM before boot and
# serialize realizations so concurrent VM checks fit the hosted runner budget.
extra_setup = ['''
set -eu
test "${RUNNER_ENVIRONMENT:-}" = github-hosted
test -c /dev/kvm
sudo chmod a+rw /dev/kvm
test -r /dev/kvm && test -w /dev/kvm
{
  printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
  printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2'
  printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
} >> "$GITHUB_ENV"
''']

[ci.nix_build]
max_parallel = 2
max_jobs = 1
cores = 2
timeout_minutes = 40
capture_results = true
artifact_retention_days = 14

[ci.pages]
repo = "caniko/canix-toolbelt"
canonical_domain = "canix-toolbelt.tartanoglu.com"

[[ci.required_gates]]
id = "crate-release"
run = "nix develop --max-jobs 1 --cores 2 -c cargo publish --dry-run --locked --all-features --jobs 2"
timeout_minutes = 30

[[ci.required_gates]]
id = "generated-parity"
run = "nix run --max-jobs 1 --cores 2 github:caniko/simit/afb7939d925d3e8e9b8507387ada7efad6460df8 -- init ci --platform github --ci-provider actions --runtime nix --check --diff"
timeout_minutes = 30

[[ci.required_gates]]
id = "supported-systems"
run = "bash scripts/qualify-source.sh"
timeout_minutes = 30
