with_msrv = true
with_audit = true
with_docs = true
publish_crates = true
extra_env = { RUSTDOCFLAGS = "-D warnings" }
# Full flake checks include NixOS guests. Require hosted KVM before boot and
# serialize realizations so concurrent VM checks fit the hosted runner budget.
extra_setup = [
  '''
set -eu
bash scripts/prepare-hosted-source.sh
test -c /dev/kvm
sudo chmod a+rw /dev/kvm
test -r /dev/kvm && test -w /dev/kvm
{
  printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
  printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
  printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
} >> "$GITHUB_ENV"
if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
  # Preserve the runner's initial merge-checkout observation separately.
  cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
  expected="${GITHUB_SHA:?}"
  if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
    expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
  fi
  test "$(git rev-parse HEAD)" = "$expected"
  git diff --exit-code HEAD --
  git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
  git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
fi
''',
]
publish_strategy = "members"

[ci.nix_build]
# Grouped members share one runner's store; push runs only on the default branch.
push_branches = ["trunk"]
max_parallel = 4
max_jobs = 1
cores = 2
timeout_minutes = 120
capture_results = true
check_systems = ["x86_64-linux"]
# Reuse the patched zellij input of the pinentry family across runs.
cache_installables = [".#canix-toolbelt-zellij"]
artifact_retention_days = 32
# Preserve builder output even when a hosted timeout interrupts nix build.
artifact_paths = ["/nix/var/log/nix/drvs"]

[ci.nix_build.groups]
pinentry = [
  ".#canix-toolbelt-pinentry",
  ".#rage-pinentry",
  ".#checks.x86_64-linux.pinentry-home-eval",
]
core = [
  ".#canix-toolbelt",
  ".#canix-toolbelt-build-train",
  ".#canix-toolbelt-direct-network",
  ".#checks.x86_64-linux.direct-network-transitions",
