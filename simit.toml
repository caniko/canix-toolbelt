[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
components = ["flake-evaluation"]
nix_builds = [
  ".#canix-toolbelt-pinentry",
  ".#rage-pinentry",
  ".#checks.x86_64-linux.pinentry-home-eval",
  ".#canix-toolbelt",
  ".#canix-toolbelt-build-train",
  ".#canix-toolbelt-direct-network",
  ".#checks.x86_64-linux.direct-network-eval",
  ".#checks.x86_64-linux.executor-admission-eval",
  ".#checks.x86_64-linux.direct-network-transitions",
  ".#checks.x86_64-linux.build-train-eval",
  ".#checks.x86_64-linux.build-train-policy",
  ".#canix-toolbelt-roborev-worker",
  ".#roborev",
  ".#checks.x86_64-linux.roborev-module",
  ".#checks.x86_64-linux.roborev-unit",
  ".#checks.x86_64-linux.resumable-operator-eval",
  ".#checks.x86_64-linux.resumable-operator-runtime",
  ".#opencode-browser-adapter",
  ".#opencode-with-claude",
  ".#checks.x86_64-linux.opencode-claude-eval",
  ".#checks.x86_64-linux.opencode-jev-runtime",
  ".#checks.x86_64-linux.browser-connection-eval",
  ".#checks.x86_64-linux.browser-connection-runtime",
  ".#checks.x86_64-linux.browser-connection-smoke",
  ".#checks.x86_64-linux.direnv-eval",
  ".#checks.x86_64-linux.direnv-runtime",
  ".#checks.x86_64-linux.harbor-db-compat-eval",
  ".#checks.x86_64-linux.harbor-db-compat-runtime",
  ".#checks.x86_64-linux.dns-publication-eval",
  ".#checks.x86_64-linux.opencode-environment-eval",
  ".#checks.x86_64-linux.opencode-environment-runtime",
  ".#checks.x86_64-linux.opencode-environment-legacy",
]
with_msrv = true
with_audit = true
with_docs = true
publish_crates = true
extra_env= { RUSTDOCFLAGS = "-D warnings" }
# Full flake checks include NixOS guests. Require hosted KVM before boot and
# serialize realizations so concurrent VM checks fit the hosted runner budget.
extra_setup = ['''
set -eu
test "${RUNNER_ENVIRONMENT:-}" = github-hosted
test "${GITHUB_RUN_ATTEMPT:-}" = 1
if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
  revision="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
  git fetch origin "$revision"
  git checkout --detach "$revision"
  test "$(git rev-parse HEAD)" = "$revision"
fi
test -c /dev/kvm
sudo chmod a+rw /dev/kvm
test -r /dev/kvm && test -w /dev/kvm
{
  printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
  printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
  printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
} >> "$GITHUB_ENV"
if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
  # Preserve the runner's initial merge-checkout observation separately.
  cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
  expected="${GITHUB_SHA:?}"
  if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
    expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
  fi
  test "$(git rev-parse HEAD)" = "$expected"
  git diff --exit-code HEAD --
  git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
  git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
fi
''']

[ci.nix_build]
separate_events = true
max_parallel = 2
max_jobs = 1
cores = 2
timeout_minutes = 40
capture_results = true
artifact_retention_days = 32
# Preserve builder output even when a hosted timeout interrupts nix build.
artifact_paths = ["/nix/var/log/nix/drvs"]

[ci.pages]
repo = "caniko/canix-toolbelt"
canonical_domain = "canix-toolbelt.tartanoglu.com"

[[ci.required_gates]]
id = "crate-release"
run = "bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c cargo publish --dry-run --locked --all-features --jobs 2"
timeout_minutes = 30

[[ci.required_gates]]
id = "operator-regressions"
run = "bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c bash scripts/operator-regressions.sh"
timeout_minutes = 30

[[ci.required_gates]]
id = "generated-parity"
run = "bash scripts/prepare-hosted-source.sh && nix run --max-jobs 1 --cores 2 github:caniko/simit/0d917f8cbbf99bf271006a0cf6f590c34aa828bc -- init ci --platform github --ci-provider actions --runtime nix --check --diff"
timeout_minutes = 30

[[ci.required_gates]]
id = "supported-systems"
run = "bash scripts/prepare-hosted-source.sh && bash scripts/qualify-source.sh"
timeout_minutes = 30

[[ci.required_gates]]
id = "roborev-worker"
run = "bash scripts/prepare-hosted-source.sh && bash scripts/roborev-worker-hosted.sh"
timeout_minutes = 30
