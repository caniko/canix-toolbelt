[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
# Publish only the x86_64-linux packages Canix consumes; trunk pushes only.
push_branches = ["trunk"]
nix_builds = [
  ".#packages.x86_64-linux.canix-toolbelt-build-train",
  ".#packages.x86_64-linux.canix-toolbelt-direct-network",
  ".#packages.x86_64-linux.crush",
]

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "canix-toolbelt"
token_secret = "ATTIC_TOKEN"

[ci.custody]
repository = "caniko/canix-toolbelt"
producer_attempt = 1
status_context = "simit/producer-custody"

[ci.custody.producers.CI]
workflow = ".github/workflows/ci.yaml"
jobs = ["test", "gate-crate-release", "gate-operator-regressions", "gate-generated-parity", "gate-supported-systems", "gate-roborev-worker"]

[ci.custody.producers."Nix installable builds"]
workflow = ".github/workflows/nix-builds.yaml"
jobs = ["build (agents)", "build (core)", "build (network)", "build (pinentry)", "build (platform)", "build (roborev)", "build (services)"]
artifacts = ["nix-build-0", "nix-build-1", "nix-build-2", "nix-build-3", "nix-build-4", "nix-build-5", "nix-build-6"]

[ci.pages]
repo = "caniko/canix-toolbelt"
canonical_domain = "canix-toolbelt.tartanoglu.com"

[[ci.required_gates]]
id = "crate-release"
run = "bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c cargo publish --dry-run --locked --all-features --jobs 2"
timeout_minutes = 30

[[ci.required_gates]]
id = "operator-regressions"
run = "bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c bash scripts/operator-regressions.sh"
timeout_minutes = 30

[[ci.required_gates]]
id = "generated-parity"
run = "bash scripts/prepare-hosted-source.sh && nix run --max-jobs 1 --cores 2 github:caniko/simit/432cde792b74e5fdce8ed6e71b555e535f2b83b5 -- init ci --platform github --ci-provider actions --runtime nix --check --diff"
timeout_minutes = 30

[[ci.required_gates]]
id = "supported-systems"
run = "bash scripts/prepare-hosted-source.sh && bash scripts/qualify-source.sh"
timeout_minutes = 30

[[ci.required_gates]]
id = "roborev-worker"
run = "bash scripts/prepare-hosted-source.sh && bash scripts/roborev-worker-hosted.sh"
timeout_minutes = 30
