  ".#checks.x86_64-linux.wg-home-shared-eval",
  ".#checks.x86_64-linux.cloud-host-eval",
  ".#checks.x86_64-linux.cloud-host-install-bios",
  ".#checks.x86_64-linux.cloud-host-install-uefi",
  ".#checks.x86_64-linux.dns-apex-cname-assertion",
  ".#checks.x86_64-linux.dns-caddy-redirect-routes",
  ".#checks.x86_64-linux.dns-lib-helpers-eval",
  ".#checks.x86_64-linux.dns-octodns-apply-force",
  ".#checks.x86_64-linux.dns-pages-zone-eval",
