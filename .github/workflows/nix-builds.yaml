# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        installable:
          - ".#canix-toolbelt"
          - ".#canix-toolbelt-build-train"
          - ".#canix-toolbelt-direct-network"
          - ".#checks.x86_64-linux.direct-network-eval"
          - ".#checks.x86_64-linux.direct-network-transitions"
          - ".#checks.x86_64-linux.build-train-eval"
          - ".#checks.x86_64-linux.build-train-policy"
          - ".#canix-toolbelt-roborev-worker"
          - ".#roborev"
          - ".#checks.x86_64-linux.roborev-module"
          - ".#checks.x86_64-linux.roborev-unit"
          - ".#checks.x86_64-linux.resumable-operator-eval"
          - ".#checks.x86_64-linux.resumable-operator-runtime"
          - ".#opencode-browser-adapter"
          - ".#opencode-with-claude"
          - ".#checks.x86_64-linux.opencode-claude-eval"
          - ".#checks.x86_64-linux.opencode-jev-runtime"
          - ".#checks.x86_64-linux.browser-connection-eval"
          - ".#checks.x86_64-linux.browser-connection-runtime"
          - ".#checks.x86_64-linux.browser-connection-smoke"
          - ".#checks.x86_64-linux.direnv-eval"
          - ".#checks.x86_64-linux.direnv-runtime"
          - ".#checks.x86_64-linux.harbor-db-compat-eval"
          - ".#checks.x86_64-linux.harbor-db-compat-runtime"
          - ".#checks.x86_64-linux.dns-publication-eval"
          - ".#checks.x86_64-linux.opencode-environment-eval"
          - ".#checks.x86_64-linux.opencode-environment-runtime"
          - ".#checks.x86_64-linux.opencode-environment-legacy"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prepare Nix build evidence
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
          printf '%s\n' "$INSTALLABLE" > "$SIMIT_NIX_BUILD_RESULTS/installable"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup
        run: |
          set -eu
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          set -euo pipefail
          exec 3> >(tee "$SIMIT_NIX_BUILD_RESULTS/build.log" >&2)
          log_pid=$!
          status=0
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --json "$INSTALLABLE" 2>&3 | tee "$SIMIT_NIX_BUILD_RESULTS/result.json" || status=$?
          exec 3>&-
          wait "$log_pid"
          exit "$status"
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
            /nix/var/log/nix/drvs
