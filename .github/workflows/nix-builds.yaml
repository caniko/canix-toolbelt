# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches:
      - "trunk"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type == 'tag' && github.ref || format('refs/heads/{0}', github.event.pull_request.head.ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: "agents"
            installables: '[".#opencode-browser-adapter",".#opencode-with-claude",".#checks.x86_64-linux.opencode-claude-eval",".#checks.x86_64-linux.opencode-jev-runtime",".#checks.x86_64-linux.opencode-environment-eval",".#checks.x86_64-linux.opencode-environment-runtime",".#checks.x86_64-linux.opencode-environment-legacy",".#checks.x86_64-linux.browser-connection-eval",".#checks.x86_64-linux.browser-connection-runtime",".#checks.x86_64-linux.browser-connection-smoke",".#checks.x86_64-linux.headroom-eval",".#checks.x86_64-linux.agent-safety-eval",".#checks.x86_64-linux.agent-safety-home-eval",".#checks.x86_64-linux.dev-agent-isolation-eval",".#checks.x86_64-linux.dev-agent-isolation-scope",".#checks.x86_64-linux.dev-oom-guard-pause-eval",".#checks.x86_64-linux.dev-oom-guard-protection",".#checks.x86_64-linux.chromium-gpu-eval"]'
          - group: "core"
            installables: '[".#canix-toolbelt",".#canix-toolbelt-build-train",".#canix-toolbelt-direct-network",".#checks.x86_64-linux.direct-network-transitions",".#checks.x86_64-linux.direct-network-eval",".#checks.x86_64-linux.direct-link-eval",".#checks.x86_64-linux.executor-admission-eval",".#checks.x86_64-linux.build-train-eval",".#checks.x86_64-linux.build-train-policy",".#checks.x86_64-linux.resumable-operator-eval",".#checks.x86_64-linux.resumable-operator-runtime",".#checks.x86_64-linux.execution-protocol"]'
          - group: "network"
            installables: '[".#checks.x86_64-linux.vpn-netns-eval",".#checks.x86_64-linux.vpn-netns-runtime",".#checks.x86_64-linux.public-edge",".#checks.x86_64-linux.public-edge-eval",".#checks.x86_64-linux.wg-home-endpoint-selection",".#checks.x86_64-linux.wg-home-shared-eval",".#checks.x86_64-linux.cloud-host-eval",".#checks.x86_64-linux.cloud-host-install-bios",".#checks.x86_64-linux.cloud-host-install-uefi",".#checks.x86_64-linux.dns-apex-cname-assertion",".#checks.x86_64-linux.dns-caddy-redirect-routes",".#checks.x86_64-linux.dns-lib-helpers-eval",".#checks.x86_64-linux.dns-octodns-apply-force",".#checks.x86_64-linux.dns-pages-zone-eval",".#checks.x86_64-linux.dns-publication-eval",".#checks.x86_64-linux.ssh-aliases-eval",".#checks.x86_64-linux.host-selection-eval",".#checks.x86_64-linux.host-profile-eval"]'
          - group: "pinentry"
            installables: '[".#canix-toolbelt-pinentry",".#rage-pinentry",".#checks.x86_64-linux.pinentry-home-eval"]'
          - group: "platform"
            installables: '[".#checks.x86_64-linux.activation-contracts-eval",".#checks.x86_64-linux.activation-manifest-eval",".#checks.x86_64-linux.gpu-backends-eval",".#checks.x86_64-linux.gpu-media-eval",".#checks.x86_64-linux.gpu-render-eval",".#checks.x86_64-linux.gpu-routes-eval",".#checks.x86_64-linux.keyboard-layout-shortcut-eval",".#checks.x86_64-linux.nexus-device-types-assertion",".#checks.x86_64-linux.nexus-profiles",".#checks.x86_64-linux.pre-commit",".#checks.x86_64-linux.profile-transition-check",".#checks.x86_64-linux.treefmt"]'
          - group: "roborev"
            installables: '[".#canix-toolbelt-roborev-worker",".#roborev",".#checks.x86_64-linux.roborev-module",".#checks.x86_64-linux.roborev-unit",".#checks.x86_64-linux.roborev-shell"]'
          - group: "services"
            installables: '[".#checks.x86_64-linux.harbor-db-compat-eval",".#checks.x86_64-linux.harbor-db-compat-runtime",".#checks.x86_64-linux.gatus-instances-eval",".#checks.x86_64-linux.gatus-publisher-eval",".#checks.x86_64-linux.garage-buckets-registry-eval",".#checks.x86_64-linux.attic-projects-registry-eval",".#checks.x86_64-linux.kanidm-preset-eval",".#checks.x86_64-linux.rauthy-preset-eval",".#checks.x86_64-linux.service-topology-v2-eval",".#checks.x86_64-linux.site-helpers-eval",".#checks.x86_64-linux.project-tree-eval"]'
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Nix build evidence
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Restore grouped-build engine
        id: simit-engine-cache
        if: ${{ vars.SIMIT_CI_ENGINE_REVISION != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/simit-engine-cache
          key: simit-engine-v1-${{ vars.SIMIT_CI_ENGINE_REVISION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Import grouped-build engine
        if: ${{ steps.simit-engine-cache.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          BASH_ENV: ''
          ENV: ''
          NIX_CONFIG: 'experimental-features = nix-command flakes'
          NIX_USER_CONF_FILES: /dev/null
          NIX_PATH: ''
        run: |
          set -euo pipefail
          cache_root="$RUNNER_TEMP/simit-engine-cache"
          env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_OAUTH_TOKEN -u ATTIC_TOKEN -u CACHIX_AUTH_TOKEN -u CACHIX_SIGNING_KEY nix copy --no-check-sigs --all --from "file://$cache_root" || echo '::warning::Cached grouped-build engine failed to import; building it normally'
          rm -rf "$cache_root"
      - name: Provision grouped-build Rust engine
        shell: bash
        env:
          SIMIT_CI_ENGINE_REVISION: ${{ vars.SIMIT_CI_ENGINE_REVISION }}
          BASH_ENV: ''
          ENV: ''
          NIX_CONFIG: 'experimental-features = nix-command flakes'
          NIX_USER_CONF_FILES: /dev/null
          NIX_PATH: ''
        run: |
          [[ "$SIMIT_CI_ENGINE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll an immutable SIMIT_CI_ENGINE_REVISION containing ci nix-group' >&2; exit 1; }
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64|Linux:aarch64|Linux:arm64|Darwin:arm64|Darwin:aarch64) ;;
            *) echo 'unsupported grouped engine runner system' >&2; exit 1 ;;
          esac
          engine_path=$(env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_OAUTH_TOKEN -u ATTIC_TOKEN -u CACHIX_AUTH_TOKEN -u CACHIX_SIGNING_KEY nix build --no-link --no-update-lock-file --print-out-paths --option accept-flake-config false --option access-tokens '' --option substituters https://cache.nixos.org "github:caniko/simit/$SIMIT_CI_ENGINE_REVISION#default")
          [[ "$engine_path" =~ ^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$ ]] || { echo 'Invalid engine output inventory' >&2; exit 1; }
          test -x "$engine_path/bin/simit"
          "$engine_path/bin/simit" ci nix-group --help > /dev/null
          printf '%s\n' "$SIMIT_CI_ENGINE_REVISION" > "$SIMIT_NIX_BUILD_RESULTS/engine-source-revision"
          engine_digest=$(nix hash file --type sha256 --base16 "$engine_path/bin/simit")
          printf '%s  %s\n' "$engine_digest" "$engine_path/bin/simit" > "$SIMIT_NIX_BUILD_RESULTS/engine-executable.sha256"
          printf '%s\n' "SIMIT_CI_ENGINE=$engine_path/bin/simit" >> "$GITHUB_ENV"
      - name: Export grouped-build engine
        id: simit-engine-cache-save
        if: ${{ vars.SIMIT_CI_ENGINE_REVISION != '' && steps.simit-engine-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          BASH_ENV: ''
          ENV: ''
          NIX_CONFIG: 'experimental-features = nix-command flakes'
          NIX_USER_CONF_FILES: /dev/null
          NIX_PATH: ''
        run: |
          set -euo pipefail
          cache_root="$RUNNER_TEMP/simit-engine-cache"
          rm -rf "$cache_root"
          if nix copy --to "file://$cache_root?compression=zstd" "${SIMIT_CI_ENGINE%/bin/simit}"; then
            printf 'save=true\n' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Grouped-build engine failed to export; not saving it'
          fi
      - name: Save grouped-build engine
        if: ${{ steps.simit-engine-cache-save.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/simit-engine-cache
          key: simit-engine-v1-${{ vars.SIMIT_CI_ENGINE_REVISION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Project setup
        run: |
          set -eu
          bash scripts/prepare-hosted-source.sh
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"
          if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
            # Preserve the runner's initial merge-checkout observation separately.
            cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
            expected="${GITHUB_SHA:?}"
            if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
              expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            fi
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --exit-code HEAD --
            git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
            git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
          fi

