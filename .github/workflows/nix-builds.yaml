# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        installable:
          - ".#checks.x86_64-linux.execution-protocol"
          - ".#canix-toolbelt-pinentry"
          - ".#rage-pinentry"
          - ".#checks.x86_64-linux.pinentry-home-eval"
          - ".#canix-toolbelt"
          - ".#canix-toolbelt-build-train"
          - ".#canix-toolbelt-direct-network"
          - ".#checks.x86_64-linux.direct-network-eval"
          - ".#checks.x86_64-linux.executor-admission-eval"
          - ".#checks.x86_64-linux.direct-network-transitions"
          - ".#checks.x86_64-linux.build-train-eval"
          - ".#checks.x86_64-linux.build-train-policy"
          - ".#canix-toolbelt-roborev-worker"
          - ".#roborev"
          - ".#checks.x86_64-linux.roborev-module"
          - ".#checks.x86_64-linux.roborev-unit"
          - ".#checks.x86_64-linux.resumable-operator-eval"
          - ".#checks.x86_64-linux.resumable-operator-runtime"
          - ".#opencode-browser-adapter"
          - ".#opencode-with-claude"
          - ".#checks.x86_64-linux.opencode-claude-eval"
          - ".#checks.x86_64-linux.opencode-jev-runtime"
          - ".#checks.x86_64-linux.headroom-eval"
          - ".#checks.x86_64-linux.browser-connection-eval"
          - ".#checks.x86_64-linux.browser-connection-runtime"
          - ".#checks.x86_64-linux.browser-connection-smoke"
          - ".#checks.x86_64-linux.direnv-eval"
          - ".#checks.x86_64-linux.direnv-runtime"
          - ".#checks.x86_64-linux.harbor-db-compat-eval"
          - ".#checks.x86_64-linux.harbor-db-compat-runtime"
          - ".#checks.x86_64-linux.dns-publication-eval"
          - ".#checks.x86_64-linux.opencode-environment-eval"
          - ".#checks.x86_64-linux.opencode-environment-runtime"
          - ".#checks.x86_64-linux.opencode-environment-legacy"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prepare Nix build evidence
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
          printf '%s\n' "$INSTALLABLE" > "$SIMIT_NIX_BUILD_RESULTS/installable"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup
        run: |
          set -eu
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          # Branch/PR qualification binds original attempt-1 production. A signed-tag
          # release can retry its original run after a transient upload/registry failure.
          if [ "${GITHUB_EVENT_NAME:-}" != push ] || [ "${GITHUB_REF_TYPE:-}" != tag ]; then
            test "${GITHUB_RUN_ATTEMPT:-}" = 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
            revision="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            git fetch origin "$revision"
            git checkout --detach "$revision"
            test "$(git rev-parse HEAD)" = "$revision"
          fi
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          # Ubuntu 24.04 mediates capabilities in newly created user namespaces.
          # Permit the Nix-store launcher and builder on this disposable runner;
          # retain AppArmor and its global unprivileged-userns restriction.
          # https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            nix_daemon="$(readlink -f "$(command -v nix-daemon)")"
            case "$nix_daemon" in /nix/store/*/bin/*) ;; *) exit 1 ;; esac
            # Nix's user namespace can hide host-root ownership. Bootstrap then correctly
            # seals unshare into a memfd, which has no pathname attachment. Let that sealed
            # launcher inherit userns admission from its trusted Nix builder instead.
            sudo tee /etc/apparmor.d/canix-toolbelt-qualification-nix >/dev/null <<APPARMOR
          profile canix-toolbelt-qualification-nix "$nix_daemon" flags=(unconfined) {
            userns,
          }
          APPARMOR
            sudo apparmor_parser --replace /etc/apparmor.d/canix-toolbelt-qualification-nix
            sudo systemctl restart nix-daemon.service
            nix_daemon_pid="$(systemctl show --property MainPID --value nix-daemon.service)"
            sudo grep '^canix-toolbelt-qualification-nix ' "/proc/$nix_daemon_pid/attr/current"
            sudo tee /etc/apparmor.d/canix-toolbelt-qualification-unshare >/dev/null <<'APPARMOR'
          profile canix-toolbelt-qualification-unshare /nix/store/*/bin/unshare flags=(unconfined) {
            userns,
          }
          APPARMOR
            sudo apparmor_parser --replace /etc/apparmor.d/canix-toolbelt-qualification-unshare
            sudo grep '^canix-toolbelt-qualification-unshare ' /sys/kernel/security/apparmor/profiles
          fi
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"
          if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
            # Preserve the runner's initial merge-checkout observation separately.
            cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
            expected="${GITHUB_SHA:?}"
            if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
              expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            fi
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --exit-code HEAD --
            git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
            git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
          fi

      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          set -euo pipefail
          exec 3> >(tee "$SIMIT_NIX_BUILD_RESULTS/build.log" >&2)
          log_pid=$!
          status=0
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --json "$INSTALLABLE" 2>&3 | tee "$SIMIT_NIX_BUILD_RESULTS/result.json" || status=$?
          exec 3>&-
          wait "$log_pid"
          exit "$status"
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 32
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
            /nix/var/log/nix/drvs
