            core) members=(.#canix-toolbelt .#canix-toolbelt-build-train .#canix-toolbelt-direct-network .#checks.x86_64-linux.direct-network-transitions .#checks.x86_64-linux.direct-network-eval .#checks.x86_64-linux.direct-link-eval .#checks.x86_64-linux.executor-admission-eval .#checks.x86_64-linux.build-train-eval .#checks.x86_64-linux.build-train-policy .#checks.x86_64-linux.resumable-operator-eval .#checks.x86_64-linux.resumable-operator-runtime .#checks.x86_64-linux.execution-protocol) ;;
            network) members=(.#checks.x86_64-linux.vpn-netns-eval .#checks.x86_64-linux.vpn-netns-runtime .#checks.x86_64-linux.public-edge .#checks.x86_64-linux.public-edge-eval .#checks.x86_64-linux.wg-home-endpoint-selection .#checks.x86_64-linux.wg-home-shared-eval .#checks.x86_64-linux.cloud-host-eval .#checks.x86_64-linux.cloud-host-install-bios .#checks.x86_64-linux.cloud-host-install-uefi .#checks.x86_64-linux.dns-apex-cname-assertion .#checks.x86_64-linux.dns-caddy-redirect-routes .#checks.x86_64-linux.dns-lib-helpers-eval .#checks.x86_64-linux.dns-octodns-apply-force .#checks.x86_64-linux.dns-pages-zone-eval .#checks.x86_64-linux.dns-publication-eval .#checks.x86_64-linux.ssh-aliases-eval .#checks.x86_64-linux.host-selection-eval .#checks.x86_64-linux.host-profile-eval) ;;
