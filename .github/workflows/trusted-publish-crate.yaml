# Generated by simit. Manual edits will be reported as ci=drift.
# Enroll only after moving CRATES_IO_API_TOKEN into the literal environment below,
# restricting it to the exact protected default branch, and qualifying the engine revision.
# Tag-controlled workflows must have no repository/org publishing credential.
# Recovery: rerun the original signed-tag run; matching immutable archives remain reusable.
name: Trusted Crate Publisher

on:
  workflow_run:
    workflows: ["Build Crate canix-toolbelt"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: simit-crates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-canix-toolbelt:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: .simit-publisher-engine
        run: cargo build --release --locked
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Admit signed source and provider-bound archive canix-toolbelt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package canix-toolbelt --source-workflow .github/workflows/publish-crate.yaml --publisher-workflow .github/workflows/trusted-publish-crate.yaml --reconstruct-package canix-toolbelt --publisher-output "$RUNNER_TEMP/verified-canix-toolbelt" > "$RUNNER_TEMP/verified-canix-toolbelt.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Project setup
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: |
          set -eu
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          # Branch/PR qualification binds original attempt-1 production. A signed-tag
          # release can retry its original run after a transient upload/registry failure.
          if [ "${GITHUB_EVENT_NAME:-}" != push ] || [ "${GITHUB_REF_TYPE:-}" != tag ]; then
            test "${GITHUB_RUN_ATTEMPT:-}" = 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
            revision="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            git fetch origin "$revision"
            git checkout --detach "$revision"
            test "$(git rev-parse HEAD)" = "$revision"
          fi
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          # Ubuntu 24.04 mediates capabilities in newly created user namespaces.
          # Permit the Nix-store launcher and builder on this disposable runner;
          # retain AppArmor and its global unprivileged-userns restriction.
          # https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            nix_daemon="$(readlink -f "$(command -v nix-daemon)")"
            case "$nix_daemon" in /nix/store/*/bin/*) ;; *) exit 1 ;; esac
            # Nix's user namespace can hide host-root ownership. Bootstrap then correctly
            # seals unshare into a memfd, which has no pathname attachment. Let that sealed
            # launcher inherit userns admission from its trusted Nix builder instead.
            sudo tee /etc/apparmor.d/canix-toolbelt-qualification-nix >/dev/null <<APPARMOR
          profile canix-toolbelt-qualification-nix "$nix_daemon" flags=(unconfined) {
            userns,
          }
          APPARMOR
            sudo apparmor_parser --replace /etc/apparmor.d/canix-toolbelt-qualification-nix
            sudo systemctl restart nix-daemon.service
            nix_daemon_pid="$(systemctl show --property MainPID --value nix-daemon.service)"
            sudo grep '^canix-toolbelt-qualification-nix ' "/proc/$nix_daemon_pid/attr/current"
            sudo tee /etc/apparmor.d/canix-toolbelt-qualification-unshare >/dev/null <<'APPARMOR'
          profile canix-toolbelt-qualification-unshare /nix/store/*/bin/unshare flags=(unconfined) {
            userns,
          }
          APPARMOR
            sudo apparmor_parser --replace /etc/apparmor.d/canix-toolbelt-qualification-unshare
            sudo grep '^canix-toolbelt-qualification-unshare ' /sys/kernel/security/apparmor/profiles
          fi
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"
          if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
            # Preserve the runner's initial merge-checkout observation separately.
            cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
            expected="${GITHUB_SHA:?}"
            if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
              expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            fi
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --exit-code HEAD --
            git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
            git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
          fi

      - name: Verify packaged contents canix-toolbelt
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: nix develop -c cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-canix-toolbelt/Cargo.toml"
      - name: Required gate crate-release
        timeout-minutes: 30
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c cargo publish --dry-run --locked --all-features --jobs 2
      - name: Required gate operator-regressions
        timeout-minutes: 30
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c bash scripts/operator-regressions.sh
      - name: Required gate generated-parity
        timeout-minutes: 30
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: bash scripts/prepare-hosted-source.sh && nix run --max-jobs 1 --cores 2 github:caniko/simit/db79439e9a7f4863fccba33aee9f325bf9c760c2 -- init ci --platform github --ci-provider actions --runtime nix --check --diff
      - name: Required gate supported-systems
        timeout-minutes: 30
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: bash scripts/prepare-hosted-source.sh && bash scripts/qualify-source.sh
      - name: Required gate roborev-worker
        timeout-minutes: 30
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          RUSTDOCFLAGS: "-D warnings"
          RUST_TEST_THREADS: "2"
        run: bash scripts/prepare-hosted-source.sh && bash scripts/roborev-worker-hosted.sh
  publish-canix-toolbelt:
    needs: [verify-canix-toolbelt]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: .simit-publisher-engine
        run: cargo build --release --locked
      - name: Upload independently verified archive canix-toolbelt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: .simit-publisher-engine/target/release/simit release publisher --publisher-stage publish --repo "$GITHUB_REPOSITORY" --package canix-toolbelt --source-workflow .github/workflows/publish-crate.yaml --publisher-workflow .github/workflows/trusted-publish-crate.yaml --reconstruct-package canix-toolbelt
  publish-report:
    needs: [publish-canix-toolbelt]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Release result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          echo 'resume: rerun the original tag-push run; already-published crates with matching checksums exit 0 after exact registry resolution'
          echo 'see per-crate job statuses for the auditable result'
