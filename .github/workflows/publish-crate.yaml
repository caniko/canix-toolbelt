# Generated by simit. Manual edits will be reported as ci=drift.
# Before creating and pushing a release tag, run `simit changelog release <version>` locally.
# Required release trust roots and secrets:
# - keys/maintainers.gpg: pinned maintainer OpenPGP public keys for git verify-tag.
name: Publish Crate

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Project setup
        run: |
          set -eu
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"

      - name: Validate signed release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi

          # cargo pkgid scopes the version lookup to the crate this workflow publishes.
          version="$(nix develop -c cargo pkgid -p canix-toolbelt | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read package version from cargo pkgid" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match Cargo.toml package version $version" >&2
            exit 1
          fi

          test -s keys/maintainers.gpg
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/maintainers.gpg
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"

      - name: Check flake
        run: nix flake check

      - name: Test all features
        run: nix develop -c cargo test --all-features

      - name: Test no default features
        run: nix develop -c cargo test --no-default-features

      - name: Check cargo-audit tool
        run: nix develop -c cargo-audit --version

      - name: Check MSRV
        run: |
          set -eu
          test "$(nix develop .#msrv -c rustc --version | cut -d ' ' -f 2)" = '1.88.0'
          nix develop .#msrv -c cargo check --all-targets --all-features

      - name: Fetch RustSec advisory database
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          rm -rf "$db"
          mkdir -p "$(dirname "$db")"
          git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 clone --depth 1 https://github.com/RustSec/advisory-db.git "$db"

      - name: Audit dependencies
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          nix develop -c cargo audit --db "$db" --no-fetch --stale

      - name: Build docs
        run: nix develop .#docs -c cargo doc --no-deps --all-features

      - name: Clippy all features
        run: nix develop -c cargo clippy --all-targets --all-features -- --deny warnings

      - name: Clippy no default features
        run: nix develop -c cargo clippy --all-targets --no-default-features -- --deny warnings

      - name: Dry-run publish
        run: nix develop -c cargo publish --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          crate_name='canix-toolbelt'
          version="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$version" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            version="${ref#refs/tags/}"
          fi
          if [ -z "$version" ]; then
            echo "Could not determine release version from tag ref" >&2
            exit 1
          fi
          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates
            else
              echo "curl is required to check crates.io for existing versions" >&2
              exit 1
            fi
          fi
          if ! status="$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' -A 'simit init ci publish check' "https://crates.io/api/v1/crates/${crate_name}/${version}")"; then
            status=000
          fi
          case "$status" in
            200)
              echo "${crate_name} ${version} is already published on crates.io; skipping publish"
              exit 0
              ;;
            404)
              ;;
            *)
              echo "Could not check crates.io for ${crate_name} ${version} before publishing (HTTP $status)" >&2
              exit 1
              ;;
          esac
          if [ -z "${CRATES_IO_API_TOKEN:-}" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2
            exit 1
          fi
          export CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          nix develop -c cargo publish
