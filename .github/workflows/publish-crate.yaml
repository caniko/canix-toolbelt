# Generated by simit. Manual edits will be reported as ci=drift.
# Before creating and pushing a release tag, run `simit changelog release <version>` locally.
# Required release trust roots and secrets:
# - keys/maintainers.gpg: pinned maintainer OpenPGP public keys for git verify-tag.
name: "Build Crate canix-toolbelt"

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Validate signed release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"

          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          signed_tag_name="$(git cat-file tag "refs/tags/$tag" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$tag" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          if [ "$validated_sha" != "$checkout_sha" ]; then
            echo "Signed tag commit does not match the checkout being published" >&2
            exit 1
          fi

          # cargo pkgid scopes the version lookup to the crate this workflow publishes.
          version="$(nix develop -c cargo pkgid -p canix-toolbelt | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read package version from cargo pkgid" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match Cargo.toml package version $version" >&2
            exit 1
          fi

      - name: Project setup
        run: |
          set -eu
          bash scripts/prepare-hosted-source.sh
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"
          if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
            # Preserve the runner's initial merge-checkout observation separately.
            cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
            expected="${GITHUB_SHA:?}"
            if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
              expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            fi
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --exit-code HEAD --
            git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
            git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
          fi

      - name: Required gate crate-release
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c cargo publish --dry-run --locked --all-features --jobs 2
      - name: Required gate operator-regressions
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: bash scripts/prepare-hosted-source.sh && nix develop --max-jobs 1 --cores 2 -c bash scripts/operator-regressions.sh
      - name: Required gate generated-parity
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: bash scripts/prepare-hosted-source.sh && nix run --max-jobs 1 --cores 2 github:caniko/simit/d52947d94849bbfb6db22812adc90a3c2920c080 -- init ci --platform github --ci-provider actions --runtime nix --check --diff
      - name: Required gate supported-systems
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: bash scripts/prepare-hosted-source.sh && bash scripts/qualify-source.sh
      - name: Required gate roborev-worker
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: bash scripts/prepare-hosted-source.sh && bash scripts/roborev-worker-hosted.sh
      - name: Check flake
        run: nix flake check

      - name: Test all features
        run: nix develop -c cargo test --all-features

      - name: Test no default features
        run: nix develop -c cargo test --no-default-features

      - name: Check cargo-audit tool
        run: nix develop -c cargo-audit --version

      - name: Check MSRV
        run: |
          set -eu
          test "$(nix develop .#msrv -c rustc --version | cut -d ' ' -f 2)" = '1.88.0'
          nix develop .#msrv -c cargo check --all-targets --all-features

      - name: Fetch RustSec advisory database
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          rm -rf "$db"
          mkdir -p "$(dirname "$db")"
          git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 clone --depth 1 https://github.com/RustSec/advisory-db.git "$db"

      - name: Audit dependencies
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          nix develop -c cargo audit --db "$db" --no-fetch --stale

      - name: Build docs
        run: nix develop .#docs -c cargo doc --no-deps --all-features

      - name: Clippy all features
        run: nix develop -c cargo clippy --all-targets --all-features -- --deny warnings

      - name: Clippy no default features
        run: nix develop -c cargo clippy --all-targets --no-default-features -- --deny warnings

      - name: Dry-run publish
        run: nix develop -c cargo publish --dry-run

      - name: Build immutable archive canix-toolbelt
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p canix-toolbelt | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          nix develop -c cargo package --locked --allow-dirty --no-verify -p canix-toolbelt --target-dir "$RUNNER_TEMP/simit-package-target"
          mkdir -p "$RUNNER_TEMP/simit-crates/canix-toolbelt"
          cp "$RUNNER_TEMP/simit-package-target/package/canix-toolbelt-$version.crate" "$RUNNER_TEMP/simit-crates/canix-toolbelt/"
      - name: Retain original-run archive canix-toolbelt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-canix-toolbelt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/canix-toolbelt/*.crate
          if-no-files-found: error
          retention-days: 30
