# Generated by simit. Manual edits will be reported as ci=drift.
name: pages

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup
        run: |
          set -eu
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_RUN_ATTEMPT:-}" = 1
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
            revision="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            git fetch origin "$revision"
            git checkout --detach "$revision"
            test "$(git rev-parse HEAD)" = "$revision"
          fi
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"
          if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
            # Preserve the runner's initial merge-checkout observation separately.
            cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
            expected="${GITHUB_SHA:?}"
            if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
              expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            fi
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --exit-code HEAD --
            git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
            git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build Pages site
        run: |
          nix build .#site --out-link result-pages-site
          test -f result-pages-site/.domains
          grep -qx canix-toolbelt.tartanoglu.com result-pages-site/.domains
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: result-pages-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
