name: Prepare declared Simit CI source

on:
  pull_request:
    paths:
      - simit.toml
      - README.md
      - .github/workflows/prepare-ci-source.yaml

permissions:
  contents: read

concurrency:
  group: prepare-ci-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Render through the declared immutable generator
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          GENERATOR_REF: github:caniko/simit/afb7939d925d3e8e9b8507387ada7efad6460df8
          # Hosted generation uses the committed public trust root, just as the
          # pinned generator supports for environments without a local GPG key.
          SIMIT_MAINTAINERS_GPG: ${{ github.workspace }}/keys/maintainers.gpg
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          EVIDENCE="$RUNNER_TEMP/ci-source"
          mkdir -p "$EVIDENCE/workflows"
          git show --no-patch --format='%H%n%T%n%P' HEAD > "$EVIDENCE/source.txt"
          cp simit.toml "$EVIDENCE/policy.toml"
          sha256sum keys/maintainers.gpg > "$EVIDENCE/maintainers.sha256"
          printf '%s\n' "$GENERATOR_REF" > "$EVIDENCE/generator-ref.txt"
          nix build --no-link --no-write-lock-file --max-jobs 1 --cores 2 --json "$GENERATOR_REF#default" 2> >(tee "$EVIDENCE/producer-build.log" >&2) | tee "$EVIDENCE/producer-build.json"
          generator="$(jq -r '.[0].outputs.out' "$EVIDENCE/producer-build.json")/bin/simit"
          sha256sum "$generator" > "$EVIDENCE/generator.sha256"
          "$generator" init ci --platform github --ci-provider actions --runtime nix 2>&1 | tee "$EVIDENCE/generation.log"
          "$generator" init ci --platform github --ci-provider actions --runtime nix --check --diff 2>&1 | tee "$EVIDENCE/parity.log"
          git diff --exit-code -- keys/maintainers.gpg
          # init ci owns the README badges as well as the workflow files. Retain
          # both outputs so a clean consumer imports the complete generated patch.
          git diff --binary -- .github/workflows README.md > "$EVIDENCE/generated-ci.patch"
          cp README.md "$EVIDENCE/README.md"
          cp .github/workflows/ci.yaml .github/workflows/nix-builds.yaml .github/workflows/pages.yaml .github/workflows/publish-crate.yaml "$EVIDENCE/workflows/"
      - name: Seal source preparation evidence
        if: always()
        env:
          PREPARATION_STATUS: ${{ job.status }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ci-source'
          root.mkdir(parents=True, exist_ok=True)
          members = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(root.rglob('*')) if p.is_file()}
          receipt = {'schema': 'toolbelt.ci-source-preparation.v1', 'qualified': False,
                     'head': os.environ['SOURCE_HEAD'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'outcome': os.environ['PREPARATION_STATUS'],
                     'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
                     'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'], 'members': members}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-source-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          retention-days: 32
          if-no-files-found: error
          path: ${{ runner.temp }}/ci-source/
