# Generated by simit. Manual edits will be reported as ci=drift.
name: Retain completed producer custody

on:
  workflow_run:
    workflows:
      - "CI"
      - "Nix installable builds"
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      group: ${{ steps.identity.outputs.group }}
      eligible: ${{ steps.identity.outputs.eligible }}
    steps:
      - name: Establish completion target identity
        id: identity
        shell: python
        env:
          SIMIT_CUSTODY_PHASE: identity
          SIMIT_CUSTODY_CONFIG: '{"repository":"caniko/canix-toolbelt","producer_attempt":1,"status_context":"simit/producer-custody","producers":{"CI":{"workflow":".github/workflows/ci.yaml","jobs":["test","gate-crate-release","gate-operator-regressions","gate-generated-parity","gate-supported-systems","gate-roborev-worker"],"artifacts":[]},"Nix installable builds":{"workflow":".github/workflows/nix-builds.yaml","jobs":["build (agents)","build (core)","build (network)","build (pinentry)","build (platform)","build (roborev)","build (services)"],"artifacts":["nix-build-0","nix-build-1","nix-build-2","nix-build-3","nix-build-4","nix-build-5","nix-build-6"]}}}'
        run: |
          """Observe completed originals. Never execute or extract producer-controlled data."""
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import queue
          import struct
          import subprocess
          import threading
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urlencode, quote, urlsplit, unquote

          MAX_BYTES = 512 * 1024 * 1024
          MAX_CAPTURE_BYTES = MAX_BYTES
          MAX_EXPANDED_BYTES = MAX_BYTES
          MAX_CAPTURE_REQUESTS = 256
          MAX_CAPTURE_FILES = 256
          MAX_ARCHIVE_MEMBERS = 10000
          MAX_DIRECTORY_BYTES = 16 * 1024 * 1024
          MAX_CAPTURE_SECONDS = 360
          MAX_EVENT_BYTES = 1024 * 1024


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def api(repository, endpoint, maximum=MAX_BYTES, timeout=90, query=None):
              """Bound downloads during receipt, including stalled pipes and diagnostics."""
              require(maximum >= 0 and timeout > 0, 'Capture budget exhausted')
              command = ['gh', 'api', '--allow-escape-sequences', '--hostname', 'github.com']
              if query is None:
                  command.append(f'repos/{repository}/{endpoint}')
              else:
                  require(endpoint == 'graphql', 'Invalid workflow-file proof endpoint')
                  command.extend(['graphql', '--method', 'POST', '--raw-field', 'query=' + query])
              deadline = time.monotonic() + timeout
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              events = queue.Queue(maxsize=4)
              stop = threading.Event()

              def receive(pipe, name):
                  try:
                      while not stop.is_set():
                          raw = os.read(pipe.fileno(), 65536)
                          while not stop.is_set():
                              try:
                                  events.put((name, raw), timeout=0.1)
                                  break
                              except queue.Full:
                                  pass
                          if not raw:
                              return
                  except Exception as error:
                      while not stop.is_set():
                          try:
                              events.put((name, error), timeout=0.1)
                              return
                          except queue.Full:
                              pass

              with subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE) as process:
                  readers = [threading.Thread(target=receive, args=(pipe, name), daemon=True, name='custody-download-' + name)
                             for pipe, name in [(process.stdout, 'stdout'), (process.stderr, 'stderr')]]
                  for reader in readers:
                      reader.start()
                  try:
                      completed = set()
                      while len(completed) < 2:
                          remaining = deadline - time.monotonic()
                          require(remaining > 0, 'Provider download timed out')
                          try:
                              name, chunk = events.get(timeout=remaining)
                          except queue.Empty as error:
                              raise RuntimeError('Provider download timed out') from error
                          if isinstance(chunk, Exception):
                              raise chunk
                          limit = maximum if name == 'stdout' else 65536
                          require(len(buffers[name]) + len(chunk) <= limit, 'Provider response exceeds capture budget')
                          if chunk:
                              buffers[name].extend(chunk)
                          else:
                              completed.add(name)
                      status = process.wait(timeout=max(0, deadline - time.monotonic()))
                      if status:
                          raise subprocess.CalledProcessError(status, command, stderr=bytes(buffers['stderr']))
                  finally:
                      stop.set()
                      if process.poll() is None:
                          process.kill()
                      process.wait(timeout=5)
                      for reader in readers:
                          reader.join(timeout=1)
                      require(not any(reader.is_alive() for reader in readers), 'Provider pipe reader did not stop')
              return bytes(buffers['stdout'])


          class CaptureBudget:
              def __init__(self):
                  self.downloaded = self.retained = self.expanded = 0
                  self.requests = self.files = self.members = 0
                  self.deadline = time.monotonic() + MAX_CAPTURE_SECONDS

              def request(self, repository, endpoint, query=None):
                  self.requests += 1
                  require(self.requests <= MAX_CAPTURE_REQUESTS, 'Capture request inventory exceeds its bound')
                  remaining = self.deadline - time.monotonic()
                  require(remaining > 0, 'Aggregate capture deadline exceeded')
                  options = {'query': query} if query is not None else {}
                  raw = api(repository, endpoint, maximum=min(MAX_BYTES, MAX_CAPTURE_BYTES - self.downloaded),
                            timeout=min(90, remaining), **options)
                  self.downloaded += len(raw)
                  require(self.downloaded <= MAX_CAPTURE_BYTES, 'Aggregate download budget exceeded')
                  return raw

              def retain(self, path, raw):
                  self.files += 1
                  self.retained += len(raw)
                  require(self.files <= MAX_CAPTURE_FILES and self.retained <= MAX_CAPTURE_BYTES,
                          'Aggregate retained custody budget exceeded')
                  path.write_bytes(raw)

              def archive(self, entries):
                  self.members += len(entries)
                  self.expanded += sum(entry.file_size for entry in entries)
                  require(self.members <= MAX_ARCHIVE_MEMBERS and self.expanded <= MAX_EXPANDED_BYTES,
                          'Aggregate archive expansion budget exceeded')


          def repository_identity(value):
              require(isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', value),
                      'Invalid repository identity')
              return value.lower()


          def branch_identity(value):
              require(isinstance(value, str) and 0 < len(value.encode()) <= 1024
                      and not any(ord(character) < 32 or ord(character) == 127 for character in value),
                      'Invalid branch identity')
              return hashlib.sha256(value.encode()).hexdigest()


          def pages(repository, endpoint, key, fetch=None):
              collected, total = [], None
              for page in range(1, 21):
                  separator = '&' if '?' in endpoint else '?'
                  response = json.loads((fetch or api)(repository, f'{endpoint}{separator}per_page=100&page={page}'))
                  count = response['total_count']
                  require(type(count) is int and 0 <= count <= 2000, 'Provider inventory exceeds its bound')
                  require(total is None or total == count, 'Provider inventory changed during collection')
                  total = count
                  rows = response[key]
                  require(isinstance(rows, list) and len(rows) == min(100, total - len(collected)), 'Provider page is incomplete')
                  collected.extend(rows)
                  if len(collected) == total:
                      return collected
              raise RuntimeError('Provider inventory exceeds bounded collection')


          def zip_inventory(raw, budget):
              """Bound actual directory records before ZipFile eagerly creates ZipInfo objects.

              Match CPython zipfile's _EndRecData/_RealGetContents framing, including
              concatenated archives and ZIP64 end records. _EndRecData reads only the
              bounded EOCD tail and fixed ZIP64 records; it never parses member inventory.
              """
              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
              end = zipfile._EndRecData(io.BytesIO(raw))
              require(end is not None, 'Missing archive directory footer')
              require(end[zipfile._ECD_DISK_NUMBER] == end[zipfile._ECD_DISK_START] == 0
                      and end[zipfile._ECD_ENTRIES_THIS_DISK] == end[zipfile._ECD_ENTRIES_TOTAL],
                      'Unsupported split archive')
              size = end[zipfile._ECD_SIZE]
              stop = end[zipfile._ECD_LOCATION]
              if end[zipfile._ECD_SIGNATURE] == zipfile.stringEndArchive64:
                  # 3.12 returns the classic EOCD location; 3.14 returns the ZIP64 record
                  # location (and supports extensible data). Use the actual footer framing.
                  if raw[stop:stop + 4] == zipfile.stringEndArchive:
                      stop -= zipfile.sizeEndCentDir64 + zipfile.sizeEndCentDir64Locator
                  require(raw[stop:stop + 4] == zipfile.stringEndArchive64, 'Invalid ZIP64 directory footer')
              position = stop - size
              require(0 <= size <= MAX_DIRECTORY_BYTES and 0 <= position <= stop <= len(raw)
                      and 0 <= end[zipfile._ECD_OFFSET] <= position,
                      'Archive directory exceeds custody bounds')
              count = expanded = 0
              while position < stop:
                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                  require(position + zipfile.sizeCentralDir <= stop, 'Truncated archive directory record')
                  header = struct.unpack_from(zipfile.structCentralDir, raw, position)
                  require(header[zipfile._CD_SIGNATURE] == zipfile.stringCentralDir, 'Invalid archive directory record')
                  require(header[zipfile._CD_COMPRESS_TYPE] in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                          'Unsupported custody compression method')
                  count += 1
                  require(budget.members + count <= MAX_ARCHIVE_MEMBERS, 'Aggregate archive member budget exceeded')
                  extra_start = position + zipfile.sizeCentralDir + header[zipfile._CD_FILENAME_LENGTH]
                  extra_end = extra_start + header[zipfile._CD_EXTRA_FIELD_LENGTH]
                  next_position = extra_end + header[zipfile._CD_COMMENT_LENGTH]
                  require(next_position <= stop, 'Truncated archive directory fields')
                  file_size = header[zipfile._CD_UNCOMPRESSED_SIZE]
                  cursor = extra_start
                  while cursor < extra_end:
                      require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                      require(cursor + 4 <= extra_end, 'Truncated archive extra field')
                      kind, length = struct.unpack_from('<HH', raw, cursor)
                      cursor += 4
                      require(cursor + length <= extra_end, 'Truncated archive extra field')
                      if kind == 1 and file_size == 0xffffffff:
                          require(length >= 8, 'Missing ZIP64 member size')
                          file_size = struct.unpack_from('<Q', raw, cursor)[0]
                      cursor += length
                  require(file_size != 0xffffffff, 'Missing ZIP64 member size')
                  expanded += file_size
                  require(expanded <= MAX_BYTES and budget.expanded + expanded <= MAX_EXPANDED_BYTES,
                          'Aggregate archive expansion budget exceeded')
                  position = next_position
              require(count == end[zipfile._ECD_ENTRIES_TOTAL], 'Archive directory count differs')
              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
              return count, expanded


          def zip_members(raw, budget=None):
              require(len(raw) <= MAX_BYTES, 'Archive exceeds custody budget')
              budget = budget or CaptureBudget()
              count, expanded = zip_inventory(raw, budget)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                  entries = archive.infolist()
                  require(len(entries) == count and sum(entry.file_size for entry in entries) == expanded,
                          'Archive directory interpretation differs')
                  budget.archive(entries)
                  names = [entry.filename for entry in entries]
                  require(len(names) == len(set(names)), 'Duplicate archive members')
                  require(sum(entry.file_size for entry in entries) <= MAX_BYTES, 'Expanded archive exceeds custody budget')
                  for name in names:
                      require(not name.startswith('/') and '..' not in Path(name).parts, 'Unsafe archive member')
                  members = {}
                  for entry in entries:
                      require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                      if entry.is_dir():
                          continue
                      digest = hashlib.sha256()
                      read_bytes = 0
                      with archive.open(entry) as stream:
                          while True:
                              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                              chunk = stream.read(65536)
                              if not chunk:
                                  break
                              read_bytes += len(chunk)
                              require(read_bytes <= entry.file_size, 'Archive member exceeds admitted size')
                              digest.update(chunk)
                      require(read_bytes == entry.file_size, 'Archive member size differs')
                      members[entry.filename] = digest.hexdigest()
                  return members


          def run_identity(run, repository):
              """Separate a stable status target from provider-observed admission snapshots.

              PR association SHAs are observed API data, not historical base-execution
              provenance. Ambiguous/missing associations never fall back to a branch target.
              """
              def positive(value):
                  require(type(value) is int and value > 0, 'Invalid repository or PR identity')
                  return value
              def sha(value):
                  require(isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value), 'Invalid observed source SHA')
                  return value
              repo, head_repo = run['repository'], run['head_repository']
              require(repository_identity(repo['full_name']) == repository
                      == repository_identity(head_repo['full_name']), 'Producer repository differs or requires fork enrollment')
              repo_id, head_id = positive(repo['id']), positive(head_repo['id'])
              require(repo_id == head_id, 'Producer repository IDs differ')
              event = run['event']
              require(event in ['push', 'pull_request'], 'Unsupported completion event')
              branch = run['head_branch']
              branch_identity(branch)
              head = sha(run['head_sha'])
              target = {'repository': {'id': repo_id, 'name': repository}, 'event': event,
                        'head_repository': {'id': head_id, 'name': repository}, 'branch': branch}
              base = None
              if event == 'pull_request':
                  associations = run.get('pull_requests')
                  require(isinstance(associations, list) and len(associations) == 1,
                          'PR custody requires one unambiguous provider association')
                  pr = associations[0]
                  number, pr_id = positive(pr['number']), positive(pr['id'])
                  require(isinstance(pr['url'], str) and pr['url'].lower()
                          == f'https://api.github.com/repos/{repository}/pulls/{number}', 'PR target URL differs')
                  require(positive(pr['head']['repo']['id']) == head_id
                          and positive(pr['base']['repo']['id']) == repo_id, 'PR repository IDs differ')
                  require(pr['head']['ref'] == branch and sha(pr['head']['sha']) == head, 'PR observed head differs')
                  base_ref = pr['base']['ref']
                  branch_identity(base_ref)
                  base = sha(pr['base']['sha'])
                  target['pull_request'] = {'id': pr_id, 'number': number,
                                            'base_repository_id': repo_id, 'base_ref': base_ref}
              return {'target': target, 'head': head, 'observed_base_sha': base}


          def status_context(config, target):
              digest = hashlib.sha256(json.dumps(target, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              context = config['status_context'] + '/' + target['event'] + '/' + digest
              # Simit's bounded composed-context contract, enforced independently of the
              # provider's response so failure revocation uses an admitted status target.
              require(config['status_context'] and len(context.encode()) <= 100
                      and not any(ord(character) < 32 or ord(character) == 127 for character in context),
                      'Composed custody status context exceeds its bound')
              return context


          def completion_identity(config, payload):
              repository = repository_identity(config['repository'])
              require(os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'Custody requires a hosted collector')
              require(repository == repository_identity(os.environ['GITHUB_REPOSITORY'])
                      == repository_identity(payload['repository']['full_name']), 'Collector repository differs')
              run = payload['workflow_run']
              require(type(run['id']) is int and run['id'] > 0, 'Invalid completion run identity')
              snapshot = run_identity(run, repository)
              require(type(payload['repository']['id']) is int
                      and payload['repository']['id'] == snapshot['target']['repository']['id'], 'Collector repository ID differs')
              return snapshot, status_context(config, snapshot['target'])


          def workflow_path_matches(value, expected, snapshot):
              """Accept provider ref qualifications only for the observed source target."""
              if not isinstance(value, str):
                  return False
              path, separator, reference = value.partition('@')
              target = snapshot['target']
              references = {snapshot['head'], target['branch'], 'refs/heads/' + target['branch']}
              if target['event'] == 'pull_request':
                  number = target['pull_request']['number']
                  references.update({f'refs/pull/{number}/head', f'refs/pull/{number}/merge'})
              return path == expected and (not separator or reference in references)


          def unenrolled_completion(config, payload):
              """Only a positively identified, different file is outside enrollment.

              Names are not unique on GitHub. Keep enrolled files (including wrong names
              or ref qualifiers) on the normal fail/revoke path; malformed paths cannot
              establish that a completion is unrelated either.
              """
              run = payload.get('workflow_run')
              value = run.get('path') if isinstance(run, dict) else None
              if not isinstance(value, str):
                  return False
              path = value.partition('@')[0]
              return (re.fullmatch(r'\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml', path) is not None
                      and path not in {producer['workflow'] for producer in config['producers'].values()})


          def validate_run(run, head, branch, event, name, producer, attempt, repository, snapshot):
              require(type(run['id']) is int and run['id'] > 0, 'Invalid producer run identity')
              require(repository_identity(run['repository']['full_name']) == repository, 'Producer repository differs')
              require(repository_identity(run['head_repository']['full_name']) == repository, 'Fork custody requires separate enrollment')
              require(run['head_sha'] == head and run['head_branch'] == branch, 'Producer source differs')
              require(run['event'] == event and workflow_path_matches(run['path'], producer['workflow'], snapshot)
                      and run['name'] == name, 'Producer workflow or event differs')
              require(run['run_attempt'] == attempt, 'Latest producer attempt is not the enrolled original')
              require(run_identity(run, repository) == snapshot, 'Producer target or observed snapshot differs')


          def workflow_revision(run, workflow, repository, fetch, proof_path=None, budget=None):
              """Bind the executed file, independently of source head or checkout revision.

              GitHub's documented WorkflowRunFile is the executed workflow file and its
              repositoryFileUrl links to that file. Only immutable commit URLs are proof:
              https://docs.github.com/en/graphql/reference/actions#workflowrunfile
              REST head_sha, referenced reusable workflows, logs and today's merge ref do
              not identify the historical top-level workflow definition.
              """
              node_id = run.get('node_id')
              require(isinstance(node_id, str) and 0 < len(node_id) <= 256, 'Missing native workflow run node identity')
              query = ('query { node(id: ' + json.dumps(node_id) + ') { ... on WorkflowRun { '
                       'id databaseId runAttempt event checkSuite { databaseId repository { databaseId nameWithOwner } } '
                       'file { path repositoryName repositoryFileUrl run { id databaseId runAttempt } } } } }')
              raw = fetch(repository, 'graphql', query=query)
              if proof_path is not None:
                  budget.retain(proof_path, raw)
              response = json.loads(raw)
              require(isinstance(response, dict) and not response.get('errors')
                      and isinstance(response.get('data'), dict), 'Native workflow-file proof query failed')
              node = response['data'].get('node')
              require(isinstance(node, dict) and node.get('id') == node_id, 'Native workflow run node differs')
              suite = node['checkSuite']
              for actual, expected in [(node['databaseId'], run['id']), (node['runAttempt'], run['run_attempt']),
                                       (suite['databaseId'], run['check_suite_id']),
                                       (suite['repository']['databaseId'], run['repository']['id'])]:
                  require(type(actual) is int and type(expected) is int and actual > 0 and actual == expected,
                          'Native workflow-file run identity differs')
              require(node['event'] == run['event']
                      and repository_identity(suite['repository']['nameWithOwner']) == repository,
                      'Native workflow-file event or repository differs')
              file = node['file']
              require(isinstance(file, dict), 'Historical executed workflow file proof unavailable')
              require(file['path'] == workflow and repository_identity(file['repositoryName']) == repository,
                      'Executed workflow file or repository differs')
              parent = file['run']
              require(parent['id'] == node_id and type(parent['databaseId']) is int and parent['databaseId'] == run['id']
                      and type(parent['runAttempt']) is int and parent['runAttempt'] == run['run_attempt'],
                      'Executed workflow file belongs to another run or attempt')
              require(isinstance(file['repositoryFileUrl'], str), 'Missing executed workflow file URL')
              url = urlsplit(file['repositoryFileUrl'])
              parts = url.path.split('/', 5)
              require(url.scheme == 'https' and url.netloc == 'github.com' and not url.query and not url.fragment
                      and len(parts) == 6 and parts[3] == 'blob', 'Invalid executed workflow file URL')
              require(repository_identity(unquote(parts[1]) + '/' + unquote(parts[2])) == repository
                      and re.fullmatch(r'[0-9a-f]{40}', parts[4]) and unquote(parts[5]) == workflow,
                      'Executed workflow file URL is not an immutable enrolled revision')
              return {'commit': parts[4], 'workflow': workflow, 'repository': repository,
                      'repository_id': run['repository']['id'], 'node_id': node_id,
                      'run_id': run['id'], 'attempt': run['run_attempt'], 'check_suite_id': run['check_suite_id']}


          def capture(config, payload, root, budget=None):
              if unenrolled_completion(config, payload):
                  return None
              repository = repository_identity(config['repository'])
              budget = budget or CaptureBudget()
              fetch = budget.request
              require(os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'Custody requires a hosted collector')
              require(repository == repository_identity(os.environ['GITHUB_REPOSITORY'])
                      == repository_identity(payload['repository']['full_name']), 'Collector repository differs')
              event_run = payload['workflow_run']
              require(type(event_run['id']) is int and event_run['id'] > 0, 'Invalid completion run identity')
              require(repository_identity(event_run['head_repository']['full_name']) == repository, 'Completion source repository differs')
              require(re.fullmatch(r'[0-9a-f]{40}', event_run['head_sha']), 'Invalid completion source head')
              require(event_run['event'] in ['push', 'pull_request'], 'Unsupported completion event')
              branch_identity(event_run['head_branch'])
              snapshot, context = completion_identity(config, payload)
              receipt = {'schema': 'simit.producer-custody.v1', 'repository': repository,
                         'head': event_run['head_sha'], 'branch': event_run['head_branch'], 'event': event_run['event'],
                         'state': 'waiting', 'qualified': False, 'observation_is_execution': False,
                         'capture_complete': False, 'producers': [], 'policy': config,
                         'snapshot': snapshot, 'status_context': context,
                         'collector_head': os.environ['GITHUB_SHA'], 'collector_run': os.environ['GITHUB_RUN_ID'],
                         'collector_attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
              write(root / 'receipt.json', receipt)
              # Retain the safely established reporting target before querying/admitting
              # attempts, so rejected reruns and provider failures revoke prior success.
              trigger = json.loads(fetch(repository, f"actions/runs/{event_run['id']}"))
              require(trigger['event'] in ['push', 'pull_request'] and trigger['status'] == 'completed', 'Trigger is not an eligible completion')
              for key in ['head_sha', 'event', 'head_branch', 'run_attempt']:
                  require(trigger[key] == event_run[key], 'Completion event changed')
              require(trigger['name'] in config['producers'], 'Trigger workflow is not enrolled')
              require(workflow_path_matches(event_run['path'], config['producers'][trigger['name']]['workflow'], snapshot),
                      'Completion workflow path differs')
              validate_run(trigger, receipt['head'], receipt['branch'], receipt['event'],
                           trigger['name'], config['producers'][trigger['name']], config['producer_attempt'], repository, snapshot)
              receipt['trigger_snapshot'] = run_identity(trigger, repository)
              # workflow_run fires when either enrolled workflow completes. A missing or
              # incomplete sibling stays pending until its own completion event arrives.
              candidates = pages(repository, 'actions/runs?' + urlencode({'head_sha': receipt['head'],
                                 'event': receipt['event']}), 'workflow_runs', fetch)
              write(root / 'discovery.json', candidates, budget)
              selected = {}
              for name, producer in config['producers'].items():
                  matching = []
                  for candidate in candidates:
                      if (not workflow_path_matches(candidate['path'], producer['workflow'], snapshot)
                              or candidate['head_branch'] != receipt['branch']
                              or candidate['event'] != receipt['event'] or candidate['head_sha'] != receipt['head']):
                          continue
                      identity = run_identity(candidate, repository)
                      if identity['target'] != snapshot['target']:
                          continue
                      require(identity == snapshot, 'Sibling observed snapshot differs')
                      matching.append(candidate)
                  require(len(matching) <= 1, 'Duplicate original producer identity')
                  if not matching:
                      return receipt
                  run = json.loads(fetch(repository, f"actions/runs/{matching[0]['id']}"))
                  validate_run(run, receipt['head'], receipt['branch'], receipt['event'], name,
                                producer, config['producer_attempt'], repository, snapshot)
                  selected[name] = run
              if any(run['status'] != 'completed' for run in selected.values()):
                  return receipt
              commit = json.loads(fetch(repository, f"git/commits/{receipt['head']}"))
              require(commit['sha'] == receipt['head'], 'Source commit differs')
              receipt['tree'] = commit['tree']['sha']
              source_hashes = {}
              for name, producer in config['producers'].items():
                  run = selected[name]
                  folder = root / str(run['id'])
                  folder.mkdir()
                  write(folder / 'terminal.json', run, budget)
                  revision = workflow_revision(run, producer['workflow'], repository, fetch,
                                               folder / 'workflow-run-file.json', budget)
                  raw_commit = fetch(repository, f"git/commits/{revision['commit']}")
                  budget.retain(folder / 'workflow-commit.json', raw_commit)
                  workflow_commit = json.loads(raw_commit)
                  require(workflow_commit['sha'] == revision['commit']
                          and re.fullmatch(r'[0-9a-f]{40}', workflow_commit['tree']['sha']), 'Workflow commit or tree differs')
                  raw_source = fetch(repository, 'contents/' + quote(producer['workflow'], safe='/')
                                     + '?ref=' + revision['commit'])
                  budget.retain(folder / 'workflow-content.json', raw_source)
                  source = json.loads(raw_source)
                  require(source['encoding'] == 'base64' and source['type'] == 'file', 'Invalid enrolled workflow content')
                  raw = base64.b64decode(source['content'], validate=False)
                  require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == source['sha'], 'Workflow Git blob checksum differs')
                  budget.retain(folder / 'workflow.yaml', raw)
                  workflow_checksum = hashlib.sha256(raw).hexdigest()
                  source_hashes[producer['workflow']] = workflow_checksum
                  jobs = pages(repository, f"actions/runs/{run['id']}/attempts/{config['producer_attempt']}/jobs", 'jobs', fetch)
                  write(folder / 'jobs.json', jobs, budget)
                  required = {job_name: [job for job in jobs if job['name'] == job_name] for job_name in producer['jobs']}
                  require(all(len(rows) == 1 for rows in required.values()), 'Missing or duplicate enrolled jobs')
                  require(all(job['run_id'] == run['id'] and job['head_sha'] == receipt['head']
                             and job['run_attempt'] == config['producer_attempt'] for job in jobs), 'Job source or attempt differs')
                  job_logs = []
                  for job_name, rows in required.items():
                      job = rows[0]
                      require(type(job['id']) is int and job['id'] > 0, 'Invalid enrolled job identity')
                      log = fetch(repository, f"actions/jobs/{job['id']}/logs")
                      require(log and len(log) <= MAX_BYTES, 'Missing or oversized enrolled-job provider log')
                      budget.retain(folder / f"job-{job['id']}.log", log)
                      job_logs.append({'id': job['id'], 'name': job_name, 'sha256': hashlib.sha256(log).hexdigest()})
                  raw = fetch(repository, f"actions/runs/{run['id']}/attempts/{config['producer_attempt']}/logs")
                  members = zip_members(raw, budget)
                  budget.retain(folder / 'provider-logs.zip', raw)
                  require(members or run['conclusion'] != 'success', 'Successful producer has no provider logs')
                  write(folder / 'provider-log-members.json', members, budget)
                  artifacts = pages(repository, f"actions/runs/{run['id']}/artifacts", 'artifacts', fetch)
                  write(folder / 'artifacts.json', artifacts, budget)
                  retained = []
                  for artifact_name in producer['artifacts']:
                      matching = [artifact for artifact in artifacts if artifact['name'] == artifact_name]
                      require(len(matching) == 1, 'Missing or duplicate enrolled artifacts')
                      artifact = matching[0]
                      require(type(artifact['id']) is int and artifact['id'] > 0 and artifact['expired'] is False, 'Invalid or expired enrolled artifact')
                      require(artifact['size_in_bytes'] <= MAX_BYTES, 'Enrolled artifact exceeds custody budget')
                      require(artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == receipt['head'], 'Artifact source or run differs')
                      raw = fetch(repository, f"actions/artifacts/{artifact['id']}/zip")
                      checksum = hashlib.sha256(raw).hexdigest()
                      if artifact.get('digest') is not None:
                          require(artifact['digest'] == 'sha256:' + checksum, 'Provider artifact checksum differs')
                      members = zip_members(raw, budget)
                      budget.retain(folder / f"artifact-{artifact['id']}.zip", raw)
                      retained.append({'id': artifact['id'], 'name': artifact_name, 'sha256': checksum,
                                       'members': members})
                  receipt['producers'].append({'run_id': run['id'], 'workflow': producer['workflow'],
                                                'workflow_revision': revision, 'workflow_tree': workflow_commit['tree']['sha'],
                                                'source_workflow_sha256': workflow_checksum,
                                                'name': name, 'job_logs': job_logs, 'snapshot': run_identity(run, repository),
                                               'event': run['event'], 'attempt': run['run_attempt'],
                                               'conclusion': run['conclusion'], 'logs_sha256': hashlib.sha256((folder / 'provider-logs.zip').read_bytes()).hexdigest(),
                                               'jobs_accepted': all(rows[0]['status'] == 'completed' and rows[0]['conclusion'] == 'success' for rows in required.values()),
                                               'artifacts': retained})
              # Revalidate immediately before reporting; a later rerun cannot launder a
              # failed original, even if it completed while custody was being downloaded.
              for name, run in selected.items():
                  latest = json.loads(fetch(repository, f"actions/runs/{run['id']}"))
                  validate_run(latest, receipt['head'], receipt['branch'], receipt['event'], name,
                                config['producers'][name], config['producer_attempt'], repository, snapshot)
                  require(latest['status'] == 'completed' and latest['conclusion'] == run['conclusion'], 'Producer conclusion changed during capture')
                  row = next(row for row in receipt['producers'] if row['name'] == name)
                  require(workflow_revision(latest, config['producers'][name]['workflow'], repository, fetch,
                                            root / str(run['id']) / 'workflow-run-file-final.json', budget)
                          == row['workflow_revision'], 'Executed workflow revision changed during capture')
              receipt['source_workflow_sha256'] = source_hashes
              receipt['capture_budget'] = {'downloaded_bytes': budget.downloaded, 'retained_bytes': budget.retained,
                                           'expanded_bytes': budget.expanded, 'requests': budget.requests,
                                           'files': budget.files, 'archive_members': budget.members}
              receipt['capture_complete'] = True
              receipt['state'] = 'ready' if all(row['conclusion'] == 'success' and row['jobs_accepted'] for row in receipt['producers']) else 'failed'
              return receipt


          def write(path, value, budget=None):
              raw = (json.dumps(value, indent=2) + '\n').encode()
              if budget:
                  budget.retain(path, raw)
              else:
                  path.write_bytes(raw)


          def report(config, root):
              repository = repository_identity(config['repository'])
              fetch = CaptureBudget().request
              receipt = json.loads((root / 'receipt.json').read_text())
              require(receipt['repository'] == repository and receipt['policy'] == config, 'Reporting receipt policy differs')
              require(re.fullmatch(r'[0-9a-f]{40}', receipt['head']) and receipt['event'] in ['push', 'pull_request'], 'Invalid reporting target')
              snapshot = receipt['snapshot']
              require(snapshot['head'] == receipt['head'] and snapshot['target']['event'] == receipt['event']
                      and snapshot['target']['branch'] == receipt['branch']
                      and snapshot['target']['repository']['name'] == repository, 'Reporting target identity differs')
              context = status_context(config, snapshot['target'])
              require(receipt['status_context'] == context, 'Reporting context differs')
              if receipt['state'] == 'ready':
                  try:
                      require(len(receipt['producers']) == len(config['producers']), 'Reporting producer inventory differs')
                      for row in receipt['producers']:
                          latest = json.loads(fetch(repository, f"actions/runs/{row['run_id']}"))
                          validate_run(latest, receipt['head'], receipt['branch'], receipt['event'], row['name'],
                                       config['producers'][row['name']], config['producer_attempt'], repository, snapshot)
                          require(row['snapshot'] == snapshot, 'Reporting producer snapshot differs')
                          require(latest['status'] == 'completed' and latest['conclusion'] == row['conclusion'], 'Producer conclusion changed before reporting')
                          require(workflow_revision(latest, row['workflow'], repository, fetch)
                                  == row['workflow_revision'], 'Executed workflow revision changed before reporting')
                  except Exception as error:
                      receipt.update(state='failed', report_error=str(error))
                      write(root / 'report-failure.json', receipt)
              upload_ok = os.environ['SIMIT_CUSTODY_UPLOAD_OUTCOME'] == 'success' and os.environ['SIMIT_CUSTODY_ARTIFACT_ID'].isdigit()
              state = 'success' if receipt['state'] == 'ready' and receipt['capture_complete'] and upload_ok else 'pending' if receipt['state'] == 'waiting' and upload_ok else 'failure'
              identity = hashlib.sha256(json.dumps({'policy': config, 'producers': receipt['producers']}, sort_keys=True).encode()).hexdigest()[:16]
              try:
                  previous = pages(repository, f"commits/{receipt['head']}/status", 'statuses', fetch)
              except Exception as error:
                  # Deduplication is an optimization; it must never suppress revocation.
                  # An incomplete inventory also cannot establish a successful observation.
                  receipt.update(state='failed', status_lookup_error=str(error))
                  write(root / 'report-failure.json', receipt)
                  state, previous = 'failure', []
              description = f'Original-producer custody {state}: {identity}'
              current = next((status for status in previous if status['context'] == context), None)
              if current is None or current['state'] != state or current['description'] != description:
                  data = {'state': state, 'context': context, 'description': description,
                          'target_url': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
                  subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'POST',
                                  f"repos/{repository}/statuses/{receipt['head']}", '--input', '-'],
                                 input=json.dumps(data).encode(), check=True, timeout=90)
              return 1 if state == 'failure' else 0


          def main():
              config = json.loads(os.environ['SIMIT_CUSTODY_CONFIG'])
              phase = os.environ['SIMIT_CUSTODY_PHASE']
              with Path(os.environ['GITHUB_EVENT_PATH']).open('rb') as event:
                  payload_bytes = event.read(MAX_EVENT_BYTES + 1)
              require(len(payload_bytes) <= MAX_EVENT_BYTES, 'Completion event exceeds its bound')
              payload = json.loads(payload_bytes)
              # Classify before deriving a target, creating a root, retaining any bytes or
              # reading a prior receipt. Report repeats this fence after upload so an
              # unrelated completion can never publish through stale local custody.
              if unenrolled_completion(config, payload):
                  if phase == 'identity':
                      with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                          output.write('eligible=false\n')
                  return 0
              if os.environ['SIMIT_CUSTODY_PHASE'] == 'identity':
                  snapshot, _ = completion_identity(config, payload)
                  digest = hashlib.sha256(json.dumps(snapshot['target'], sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                  # Hex-only groups preserve case-sensitive refs despite case-insensitive
                  # Actions concurrency. Same-target pending replacements are observations
                  # of the same producer set; other branches/PRs/bases have distinct queues.
                  with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                      output.write('group=' + snapshot['head'] + '-' + digest + '\n')
                      output.write('eligible=true\n')
                  return 0
              root = Path(os.environ['SIMIT_CUSTODY_ROOT'])
              root.mkdir(exist_ok=True)
              if os.environ['SIMIT_CUSTODY_PHASE'] == 'report':
                  return report(config, root)
              budget = CaptureBudget()
              budget.retain(root / 'event.json', payload_bytes)
              try:
                  receipt = capture(config, payload, root, budget)
                  receipt['members'] = {}
                  for path in sorted(root.rglob('*')):
                      if path.is_file() and path.name != 'receipt.json':
                          with path.open('rb') as stream:
                              digest = hashlib.sha256()
                              while chunk := stream.read(65536):
                                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                                  digest.update(chunk)
                          receipt['members'][str(path.relative_to(root))] = digest.hexdigest()
                  write(root / 'receipt.json', receipt, budget)
              except Exception as error:
                  path = root / 'receipt.json'
                  if path.exists():
                      receipt = json.loads(path.read_text())
                      receipt.update(state='failed', error=str(error))
                      write(path, receipt)
                  raise
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
  collect:
    needs: [identity]
    if: needs.identity.outputs.eligible == 'true'
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
    concurrency:
      group: custody-${{ needs.identity.outputs.group }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_HOST: github.com
      GH_TOKEN: ${{ github.token }}
      SIMIT_CUSTODY_CONFIG: '{"repository":"caniko/canix-toolbelt","producer_attempt":1,"status_context":"simit/producer-custody","producers":{"CI":{"workflow":".github/workflows/ci.yaml","jobs":["test","gate-crate-release","gate-operator-regressions","gate-generated-parity","gate-supported-systems","gate-roborev-worker"],"artifacts":[]},"Nix installable builds":{"workflow":".github/workflows/nix-builds.yaml","jobs":["build (agents)","build (core)","build (network)","build (pinentry)","build (platform)","build (roborev)","build (services)"],"artifacts":["nix-build-0","nix-build-1","nix-build-2","nix-build-3","nix-build-4","nix-build-5","nix-build-6"]}}}'
    steps:
      - name: Capture completed original producers
        if: always()
        shell: python
        env:
          SIMIT_CUSTODY_ROOT: ${{ runner.temp }}/simit-producer-custody
          SIMIT_CUSTODY_PHASE: capture
        run: |
          """Observe completed originals. Never execute or extract producer-controlled data."""
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import queue
          import struct
          import subprocess
          import threading
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urlencode, quote, urlsplit, unquote

          MAX_BYTES = 512 * 1024 * 1024
          MAX_CAPTURE_BYTES = MAX_BYTES
          MAX_EXPANDED_BYTES = MAX_BYTES
          MAX_CAPTURE_REQUESTS = 256
          MAX_CAPTURE_FILES = 256
          MAX_ARCHIVE_MEMBERS = 10000
          MAX_DIRECTORY_BYTES = 16 * 1024 * 1024
          MAX_CAPTURE_SECONDS = 360
          MAX_EVENT_BYTES = 1024 * 1024


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def api(repository, endpoint, maximum=MAX_BYTES, timeout=90, query=None):
              """Bound downloads during receipt, including stalled pipes and diagnostics."""
              require(maximum >= 0 and timeout > 0, 'Capture budget exhausted')
              command = ['gh', 'api', '--allow-escape-sequences', '--hostname', 'github.com']
              if query is None:
                  command.append(f'repos/{repository}/{endpoint}')
              else:
                  require(endpoint == 'graphql', 'Invalid workflow-file proof endpoint')
                  command.extend(['graphql', '--method', 'POST', '--raw-field', 'query=' + query])
              deadline = time.monotonic() + timeout
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              events = queue.Queue(maxsize=4)
              stop = threading.Event()

              def receive(pipe, name):
                  try:
                      while not stop.is_set():
                          raw = os.read(pipe.fileno(), 65536)
                          while not stop.is_set():
                              try:
                                  events.put((name, raw), timeout=0.1)
                                  break
                              except queue.Full:
                                  pass
                          if not raw:
                              return
                  except Exception as error:
                      while not stop.is_set():
                          try:
                              events.put((name, error), timeout=0.1)
                              return
                          except queue.Full:
                              pass

              with subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE) as process:
                  readers = [threading.Thread(target=receive, args=(pipe, name), daemon=True, name='custody-download-' + name)
                             for pipe, name in [(process.stdout, 'stdout'), (process.stderr, 'stderr')]]
                  for reader in readers:
                      reader.start()
                  try:
                      completed = set()
                      while len(completed) < 2:
                          remaining = deadline - time.monotonic()
                          require(remaining > 0, 'Provider download timed out')
                          try:
                              name, chunk = events.get(timeout=remaining)
                          except queue.Empty as error:
                              raise RuntimeError('Provider download timed out') from error
                          if isinstance(chunk, Exception):
                              raise chunk
                          limit = maximum if name == 'stdout' else 65536
                          require(len(buffers[name]) + len(chunk) <= limit, 'Provider response exceeds capture budget')
                          if chunk:
                              buffers[name].extend(chunk)
                          else:
                              completed.add(name)
                      status = process.wait(timeout=max(0, deadline - time.monotonic()))
                      if status:
                          raise subprocess.CalledProcessError(status, command, stderr=bytes(buffers['stderr']))
                  finally:
                      stop.set()
                      if process.poll() is None:
                          process.kill()
                      process.wait(timeout=5)
                      for reader in readers:
                          reader.join(timeout=1)
                      require(not any(reader.is_alive() for reader in readers), 'Provider pipe reader did not stop')
              return bytes(buffers['stdout'])


          class CaptureBudget:
              def __init__(self):
                  self.downloaded = self.retained = self.expanded = 0
                  self.requests = self.files = self.members = 0
                  self.deadline = time.monotonic() + MAX_CAPTURE_SECONDS

              def request(self, repository, endpoint, query=None):
                  self.requests += 1
                  require(self.requests <= MAX_CAPTURE_REQUESTS, 'Capture request inventory exceeds its bound')
                  remaining = self.deadline - time.monotonic()
                  require(remaining > 0, 'Aggregate capture deadline exceeded')
                  options = {'query': query} if query is not None else {}
                  raw = api(repository, endpoint, maximum=min(MAX_BYTES, MAX_CAPTURE_BYTES - self.downloaded),
                            timeout=min(90, remaining), **options)
                  self.downloaded += len(raw)
                  require(self.downloaded <= MAX_CAPTURE_BYTES, 'Aggregate download budget exceeded')
                  return raw

              def retain(self, path, raw):
                  self.files += 1
                  self.retained += len(raw)
                  require(self.files <= MAX_CAPTURE_FILES and self.retained <= MAX_CAPTURE_BYTES,
                          'Aggregate retained custody budget exceeded')
                  path.write_bytes(raw)

              def archive(self, entries):
                  self.members += len(entries)
                  self.expanded += sum(entry.file_size for entry in entries)
                  require(self.members <= MAX_ARCHIVE_MEMBERS and self.expanded <= MAX_EXPANDED_BYTES,
                          'Aggregate archive expansion budget exceeded')


          def repository_identity(value):
              require(isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', value),
                      'Invalid repository identity')
              return value.lower()


          def branch_identity(value):
              require(isinstance(value, str) and 0 < len(value.encode()) <= 1024
                      and not any(ord(character) < 32 or ord(character) == 127 for character in value),
                      'Invalid branch identity')
              return hashlib.sha256(value.encode()).hexdigest()


          def pages(repository, endpoint, key, fetch=None):
              collected, total = [], None
              for page in range(1, 21):
                  separator = '&' if '?' in endpoint else '?'
                  response = json.loads((fetch or api)(repository, f'{endpoint}{separator}per_page=100&page={page}'))
                  count = response['total_count']
                  require(type(count) is int and 0 <= count <= 2000, 'Provider inventory exceeds its bound')
                  require(total is None or total == count, 'Provider inventory changed during collection')
                  total = count
                  rows = response[key]
                  require(isinstance(rows, list) and len(rows) == min(100, total - len(collected)), 'Provider page is incomplete')
                  collected.extend(rows)
                  if len(collected) == total:
                      return collected
              raise RuntimeError('Provider inventory exceeds bounded collection')


          def zip_inventory(raw, budget):
              """Bound actual directory records before ZipFile eagerly creates ZipInfo objects.

              Match CPython zipfile's _EndRecData/_RealGetContents framing, including
              concatenated archives and ZIP64 end records. _EndRecData reads only the
              bounded EOCD tail and fixed ZIP64 records; it never parses member inventory.
              """
              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
              end = zipfile._EndRecData(io.BytesIO(raw))
              require(end is not None, 'Missing archive directory footer')
              require(end[zipfile._ECD_DISK_NUMBER] == end[zipfile._ECD_DISK_START] == 0
                      and end[zipfile._ECD_ENTRIES_THIS_DISK] == end[zipfile._ECD_ENTRIES_TOTAL],
                      'Unsupported split archive')
              size = end[zipfile._ECD_SIZE]
              stop = end[zipfile._ECD_LOCATION]
              if end[zipfile._ECD_SIGNATURE] == zipfile.stringEndArchive64:
                  # 3.12 returns the classic EOCD location; 3.14 returns the ZIP64 record
                  # location (and supports extensible data). Use the actual footer framing.
                  if raw[stop:stop + 4] == zipfile.stringEndArchive:
                      stop -= zipfile.sizeEndCentDir64 + zipfile.sizeEndCentDir64Locator
                  require(raw[stop:stop + 4] == zipfile.stringEndArchive64, 'Invalid ZIP64 directory footer')
              position = stop - size
              require(0 <= size <= MAX_DIRECTORY_BYTES and 0 <= position <= stop <= len(raw)
                      and 0 <= end[zipfile._ECD_OFFSET] <= position,
                      'Archive directory exceeds custody bounds')
              count = expanded = 0
              while position < stop:
                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                  require(position + zipfile.sizeCentralDir <= stop, 'Truncated archive directory record')
                  header = struct.unpack_from(zipfile.structCentralDir, raw, position)
                  require(header[zipfile._CD_SIGNATURE] == zipfile.stringCentralDir, 'Invalid archive directory record')
                  require(header[zipfile._CD_COMPRESS_TYPE] in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                          'Unsupported custody compression method')
                  count += 1
                  require(budget.members + count <= MAX_ARCHIVE_MEMBERS, 'Aggregate archive member budget exceeded')
                  extra_start = position + zipfile.sizeCentralDir + header[zipfile._CD_FILENAME_LENGTH]
                  extra_end = extra_start + header[zipfile._CD_EXTRA_FIELD_LENGTH]
                  next_position = extra_end + header[zipfile._CD_COMMENT_LENGTH]
                  require(next_position <= stop, 'Truncated archive directory fields')
                  file_size = header[zipfile._CD_UNCOMPRESSED_SIZE]
                  cursor = extra_start
                  while cursor < extra_end:
                      require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                      require(cursor + 4 <= extra_end, 'Truncated archive extra field')
                      kind, length = struct.unpack_from('<HH', raw, cursor)
                      cursor += 4
                      require(cursor + length <= extra_end, 'Truncated archive extra field')
                      if kind == 1 and file_size == 0xffffffff:
                          require(length >= 8, 'Missing ZIP64 member size')
                          file_size = struct.unpack_from('<Q', raw, cursor)[0]
                      cursor += length
                  require(file_size != 0xffffffff, 'Missing ZIP64 member size')
                  expanded += file_size
                  require(expanded <= MAX_BYTES and budget.expanded + expanded <= MAX_EXPANDED_BYTES,
                          'Aggregate archive expansion budget exceeded')
                  position = next_position
              require(count == end[zipfile._ECD_ENTRIES_TOTAL], 'Archive directory count differs')
              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
              return count, expanded


          def zip_members(raw, budget=None):
              require(len(raw) <= MAX_BYTES, 'Archive exceeds custody budget')
              budget = budget or CaptureBudget()
              count, expanded = zip_inventory(raw, budget)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                  entries = archive.infolist()
                  require(len(entries) == count and sum(entry.file_size for entry in entries) == expanded,
                          'Archive directory interpretation differs')
                  budget.archive(entries)
                  names = [entry.filename for entry in entries]
                  require(len(names) == len(set(names)), 'Duplicate archive members')
                  require(sum(entry.file_size for entry in entries) <= MAX_BYTES, 'Expanded archive exceeds custody budget')
                  for name in names:
                      require(not name.startswith('/') and '..' not in Path(name).parts, 'Unsafe archive member')
                  members = {}
                  for entry in entries:
                      require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                      if entry.is_dir():
                          continue
                      digest = hashlib.sha256()
                      read_bytes = 0
                      with archive.open(entry) as stream:
                          while True:
                              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                              chunk = stream.read(65536)
                              if not chunk:
                                  break
                              read_bytes += len(chunk)
                              require(read_bytes <= entry.file_size, 'Archive member exceeds admitted size')
                              digest.update(chunk)
                      require(read_bytes == entry.file_size, 'Archive member size differs')
                      members[entry.filename] = digest.hexdigest()
                  return members


          def run_identity(run, repository):
              """Separate a stable status target from provider-observed admission snapshots.

              PR association SHAs are observed API data, not historical base-execution
              provenance. Ambiguous/missing associations never fall back to a branch target.
              """
              def positive(value):
                  require(type(value) is int and value > 0, 'Invalid repository or PR identity')
                  return value
              def sha(value):
                  require(isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value), 'Invalid observed source SHA')
                  return value
              repo, head_repo = run['repository'], run['head_repository']
              require(repository_identity(repo['full_name']) == repository
                      == repository_identity(head_repo['full_name']), 'Producer repository differs or requires fork enrollment')
              repo_id, head_id = positive(repo['id']), positive(head_repo['id'])
              require(repo_id == head_id, 'Producer repository IDs differ')
              event = run['event']
              require(event in ['push', 'pull_request'], 'Unsupported completion event')
              branch = run['head_branch']
              branch_identity(branch)
              head = sha(run['head_sha'])
              target = {'repository': {'id': repo_id, 'name': repository}, 'event': event,
                        'head_repository': {'id': head_id, 'name': repository}, 'branch': branch}
              base = None
              if event == 'pull_request':
                  associations = run.get('pull_requests')
                  require(isinstance(associations, list) and len(associations) == 1,
                          'PR custody requires one unambiguous provider association')
                  pr = associations[0]
                  number, pr_id = positive(pr['number']), positive(pr['id'])
                  require(isinstance(pr['url'], str) and pr['url'].lower()
                          == f'https://api.github.com/repos/{repository}/pulls/{number}', 'PR target URL differs')
                  require(positive(pr['head']['repo']['id']) == head_id
                          and positive(pr['base']['repo']['id']) == repo_id, 'PR repository IDs differ')
                  require(pr['head']['ref'] == branch and sha(pr['head']['sha']) == head, 'PR observed head differs')
                  base_ref = pr['base']['ref']
                  branch_identity(base_ref)
                  base = sha(pr['base']['sha'])
                  target['pull_request'] = {'id': pr_id, 'number': number,
                                            'base_repository_id': repo_id, 'base_ref': base_ref}
              return {'target': target, 'head': head, 'observed_base_sha': base}


          def status_context(config, target):
              digest = hashlib.sha256(json.dumps(target, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              context = config['status_context'] + '/' + target['event'] + '/' + digest
              # Simit's bounded composed-context contract, enforced independently of the
              # provider's response so failure revocation uses an admitted status target.
              require(config['status_context'] and len(context.encode()) <= 100
                      and not any(ord(character) < 32 or ord(character) == 127 for character in context),
                      'Composed custody status context exceeds its bound')
              return context


          def completion_identity(config, payload):
              repository = repository_identity(config['repository'])
              require(os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'Custody requires a hosted collector')
              require(repository == repository_identity(os.environ['GITHUB_REPOSITORY'])
                      == repository_identity(payload['repository']['full_name']), 'Collector repository differs')
              run = payload['workflow_run']
              require(type(run['id']) is int and run['id'] > 0, 'Invalid completion run identity')
              snapshot = run_identity(run, repository)
              require(type(payload['repository']['id']) is int
                      and payload['repository']['id'] == snapshot['target']['repository']['id'], 'Collector repository ID differs')
              return snapshot, status_context(config, snapshot['target'])


          def workflow_path_matches(value, expected, snapshot):
              """Accept provider ref qualifications only for the observed source target."""
              if not isinstance(value, str):
                  return False
              path, separator, reference = value.partition('@')
              target = snapshot['target']
              references = {snapshot['head'], target['branch'], 'refs/heads/' + target['branch']}
              if target['event'] == 'pull_request':
                  number = target['pull_request']['number']
                  references.update({f'refs/pull/{number}/head', f'refs/pull/{number}/merge'})
              return path == expected and (not separator or reference in references)


          def unenrolled_completion(config, payload):
              """Only a positively identified, different file is outside enrollment.

              Names are not unique on GitHub. Keep enrolled files (including wrong names
              or ref qualifiers) on the normal fail/revoke path; malformed paths cannot
              establish that a completion is unrelated either.
              """
              run = payload.get('workflow_run')
              value = run.get('path') if isinstance(run, dict) else None
              if not isinstance(value, str):
                  return False
              path = value.partition('@')[0]
              return (re.fullmatch(r'\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml', path) is not None
                      and path not in {producer['workflow'] for producer in config['producers'].values()})


          def validate_run(run, head, branch, event, name, producer, attempt, repository, snapshot):
              require(type(run['id']) is int and run['id'] > 0, 'Invalid producer run identity')
              require(repository_identity(run['repository']['full_name']) == repository, 'Producer repository differs')
              require(repository_identity(run['head_repository']['full_name']) == repository, 'Fork custody requires separate enrollment')
              require(run['head_sha'] == head and run['head_branch'] == branch, 'Producer source differs')
              require(run['event'] == event and workflow_path_matches(run['path'], producer['workflow'], snapshot)
                      and run['name'] == name, 'Producer workflow or event differs')
              require(run['run_attempt'] == attempt, 'Latest producer attempt is not the enrolled original')
              require(run_identity(run, repository) == snapshot, 'Producer target or observed snapshot differs')


          def workflow_revision(run, workflow, repository, fetch, proof_path=None, budget=None):
              """Bind the executed file, independently of source head or checkout revision.

              GitHub's documented WorkflowRunFile is the executed workflow file and its
              repositoryFileUrl links to that file. Only immutable commit URLs are proof:
              https://docs.github.com/en/graphql/reference/actions#workflowrunfile
              REST head_sha, referenced reusable workflows, logs and today's merge ref do
              not identify the historical top-level workflow definition.
              """
              node_id = run.get('node_id')
              require(isinstance(node_id, str) and 0 < len(node_id) <= 256, 'Missing native workflow run node identity')
              query = ('query { node(id: ' + json.dumps(node_id) + ') { ... on WorkflowRun { '
                       'id databaseId runAttempt event checkSuite { databaseId repository { databaseId nameWithOwner } } '
                       'file { path repositoryName repositoryFileUrl run { id databaseId runAttempt } } } } }')
              raw = fetch(repository, 'graphql', query=query)
              if proof_path is not None:
                  budget.retain(proof_path, raw)
              response = json.loads(raw)
              require(isinstance(response, dict) and not response.get('errors')
                      and isinstance(response.get('data'), dict), 'Native workflow-file proof query failed')
              node = response['data'].get('node')
              require(isinstance(node, dict) and node.get('id') == node_id, 'Native workflow run node differs')
              suite = node['checkSuite']
              for actual, expected in [(node['databaseId'], run['id']), (node['runAttempt'], run['run_attempt']),
                                       (suite['databaseId'], run['check_suite_id']),
                                       (suite['repository']['databaseId'], run['repository']['id'])]:
                  require(type(actual) is int and type(expected) is int and actual > 0 and actual == expected,
                          'Native workflow-file run identity differs')
              require(node['event'] == run['event']
                      and repository_identity(suite['repository']['nameWithOwner']) == repository,
                      'Native workflow-file event or repository differs')
              file = node['file']
              require(isinstance(file, dict), 'Historical executed workflow file proof unavailable')
              require(file['path'] == workflow and repository_identity(file['repositoryName']) == repository,
                      'Executed workflow file or repository differs')
              parent = file['run']
              require(parent['id'] == node_id and type(parent['databaseId']) is int and parent['databaseId'] == run['id']
                      and type(parent['runAttempt']) is int and parent['runAttempt'] == run['run_attempt'],
                      'Executed workflow file belongs to another run or attempt')
              require(isinstance(file['repositoryFileUrl'], str), 'Missing executed workflow file URL')
              url = urlsplit(file['repositoryFileUrl'])
              parts = url.path.split('/', 5)
              require(url.scheme == 'https' and url.netloc == 'github.com' and not url.query and not url.fragment
                      and len(parts) == 6 and parts[3] == 'blob', 'Invalid executed workflow file URL')
              require(repository_identity(unquote(parts[1]) + '/' + unquote(parts[2])) == repository
                      and re.fullmatch(r'[0-9a-f]{40}', parts[4]) and unquote(parts[5]) == workflow,
                      'Executed workflow file URL is not an immutable enrolled revision')
              return {'commit': parts[4], 'workflow': workflow, 'repository': repository,
                      'repository_id': run['repository']['id'], 'node_id': node_id,
                      'run_id': run['id'], 'attempt': run['run_attempt'], 'check_suite_id': run['check_suite_id']}


          def capture(config, payload, root, budget=None):
              if unenrolled_completion(config, payload):
                  return None
              repository = repository_identity(config['repository'])
              budget = budget or CaptureBudget()
              fetch = budget.request
              require(os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'Custody requires a hosted collector')
              require(repository == repository_identity(os.environ['GITHUB_REPOSITORY'])
                      == repository_identity(payload['repository']['full_name']), 'Collector repository differs')
              event_run = payload['workflow_run']
              require(type(event_run['id']) is int and event_run['id'] > 0, 'Invalid completion run identity')
              require(repository_identity(event_run['head_repository']['full_name']) == repository, 'Completion source repository differs')
              require(re.fullmatch(r'[0-9a-f]{40}', event_run['head_sha']), 'Invalid completion source head')
              require(event_run['event'] in ['push', 'pull_request'], 'Unsupported completion event')
              branch_identity(event_run['head_branch'])
              snapshot, context = completion_identity(config, payload)
              receipt = {'schema': 'simit.producer-custody.v1', 'repository': repository,
                         'head': event_run['head_sha'], 'branch': event_run['head_branch'], 'event': event_run['event'],
                         'state': 'waiting', 'qualified': False, 'observation_is_execution': False,
                         'capture_complete': False, 'producers': [], 'policy': config,
                         'snapshot': snapshot, 'status_context': context,
                         'collector_head': os.environ['GITHUB_SHA'], 'collector_run': os.environ['GITHUB_RUN_ID'],
                         'collector_attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
              write(root / 'receipt.json', receipt)
              # Retain the safely established reporting target before querying/admitting
              # attempts, so rejected reruns and provider failures revoke prior success.
              trigger = json.loads(fetch(repository, f"actions/runs/{event_run['id']}"))
              require(trigger['event'] in ['push', 'pull_request'] and trigger['status'] == 'completed', 'Trigger is not an eligible completion')
              for key in ['head_sha', 'event', 'head_branch', 'run_attempt']:
                  require(trigger[key] == event_run[key], 'Completion event changed')
              require(trigger['name'] in config['producers'], 'Trigger workflow is not enrolled')
              require(workflow_path_matches(event_run['path'], config['producers'][trigger['name']]['workflow'], snapshot),
                      'Completion workflow path differs')
              validate_run(trigger, receipt['head'], receipt['branch'], receipt['event'],
                           trigger['name'], config['producers'][trigger['name']], config['producer_attempt'], repository, snapshot)
              receipt['trigger_snapshot'] = run_identity(trigger, repository)
              # workflow_run fires when either enrolled workflow completes. A missing or
              # incomplete sibling stays pending until its own completion event arrives.
              candidates = pages(repository, 'actions/runs?' + urlencode({'head_sha': receipt['head'],
                                 'event': receipt['event']}), 'workflow_runs', fetch)
              write(root / 'discovery.json', candidates, budget)
              selected = {}
              for name, producer in config['producers'].items():
                  matching = []
                  for candidate in candidates:
                      if (not workflow_path_matches(candidate['path'], producer['workflow'], snapshot)
                              or candidate['head_branch'] != receipt['branch']
                              or candidate['event'] != receipt['event'] or candidate['head_sha'] != receipt['head']):
                          continue
                      identity = run_identity(candidate, repository)
                      if identity['target'] != snapshot['target']:
                          continue
                      require(identity == snapshot, 'Sibling observed snapshot differs')
                      matching.append(candidate)
                  require(len(matching) <= 1, 'Duplicate original producer identity')
                  if not matching:
                      return receipt
                  run = json.loads(fetch(repository, f"actions/runs/{matching[0]['id']}"))
                  validate_run(run, receipt['head'], receipt['branch'], receipt['event'], name,
                                producer, config['producer_attempt'], repository, snapshot)
                  selected[name] = run
              if any(run['status'] != 'completed' for run in selected.values()):
                  return receipt
              commit = json.loads(fetch(repository, f"git/commits/{receipt['head']}"))
              require(commit['sha'] == receipt['head'], 'Source commit differs')
              receipt['tree'] = commit['tree']['sha']
              source_hashes = {}
              for name, producer in config['producers'].items():
                  run = selected[name]
                  folder = root / str(run['id'])
                  folder.mkdir()
                  write(folder / 'terminal.json', run, budget)
                  revision = workflow_revision(run, producer['workflow'], repository, fetch,
                                               folder / 'workflow-run-file.json', budget)
                  raw_commit = fetch(repository, f"git/commits/{revision['commit']}")
                  budget.retain(folder / 'workflow-commit.json', raw_commit)
                  workflow_commit = json.loads(raw_commit)
                  require(workflow_commit['sha'] == revision['commit']
                          and re.fullmatch(r'[0-9a-f]{40}', workflow_commit['tree']['sha']), 'Workflow commit or tree differs')
                  raw_source = fetch(repository, 'contents/' + quote(producer['workflow'], safe='/')
                                     + '?ref=' + revision['commit'])
                  budget.retain(folder / 'workflow-content.json', raw_source)
                  source = json.loads(raw_source)
                  require(source['encoding'] == 'base64' and source['type'] == 'file', 'Invalid enrolled workflow content')
                  raw = base64.b64decode(source['content'], validate=False)
                  require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == source['sha'], 'Workflow Git blob checksum differs')
                  budget.retain(folder / 'workflow.yaml', raw)
                  workflow_checksum = hashlib.sha256(raw).hexdigest()
                  source_hashes[producer['workflow']] = workflow_checksum
                  jobs = pages(repository, f"actions/runs/{run['id']}/attempts/{config['producer_attempt']}/jobs", 'jobs', fetch)
                  write(folder / 'jobs.json', jobs, budget)
                  required = {job_name: [job for job in jobs if job['name'] == job_name] for job_name in producer['jobs']}
                  require(all(len(rows) == 1 for rows in required.values()), 'Missing or duplicate enrolled jobs')
                  require(all(job['run_id'] == run['id'] and job['head_sha'] == receipt['head']
                             and job['run_attempt'] == config['producer_attempt'] for job in jobs), 'Job source or attempt differs')
                  job_logs = []
                  for job_name, rows in required.items():
                      job = rows[0]
                      require(type(job['id']) is int and job['id'] > 0, 'Invalid enrolled job identity')
                      log = fetch(repository, f"actions/jobs/{job['id']}/logs")
                      require(log and len(log) <= MAX_BYTES, 'Missing or oversized enrolled-job provider log')
                      budget.retain(folder / f"job-{job['id']}.log", log)
                      job_logs.append({'id': job['id'], 'name': job_name, 'sha256': hashlib.sha256(log).hexdigest()})
                  raw = fetch(repository, f"actions/runs/{run['id']}/attempts/{config['producer_attempt']}/logs")
                  members = zip_members(raw, budget)
                  budget.retain(folder / 'provider-logs.zip', raw)
                  require(members or run['conclusion'] != 'success', 'Successful producer has no provider logs')
                  write(folder / 'provider-log-members.json', members, budget)
                  artifacts = pages(repository, f"actions/runs/{run['id']}/artifacts", 'artifacts', fetch)
                  write(folder / 'artifacts.json', artifacts, budget)
                  retained = []
                  for artifact_name in producer['artifacts']:
                      matching = [artifact for artifact in artifacts if artifact['name'] == artifact_name]
                      require(len(matching) == 1, 'Missing or duplicate enrolled artifacts')
                      artifact = matching[0]
                      require(type(artifact['id']) is int and artifact['id'] > 0 and artifact['expired'] is False, 'Invalid or expired enrolled artifact')
                      require(artifact['size_in_bytes'] <= MAX_BYTES, 'Enrolled artifact exceeds custody budget')
                      require(artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == receipt['head'], 'Artifact source or run differs')
                      raw = fetch(repository, f"actions/artifacts/{artifact['id']}/zip")
                      checksum = hashlib.sha256(raw).hexdigest()
                      if artifact.get('digest') is not None:
                          require(artifact['digest'] == 'sha256:' + checksum, 'Provider artifact checksum differs')
                      members = zip_members(raw, budget)
                      budget.retain(folder / f"artifact-{artifact['id']}.zip", raw)
                      retained.append({'id': artifact['id'], 'name': artifact_name, 'sha256': checksum,
                                       'members': members})
                  receipt['producers'].append({'run_id': run['id'], 'workflow': producer['workflow'],
                                                'workflow_revision': revision, 'workflow_tree': workflow_commit['tree']['sha'],
                                                'source_workflow_sha256': workflow_checksum,
                                                'name': name, 'job_logs': job_logs, 'snapshot': run_identity(run, repository),
                                               'event': run['event'], 'attempt': run['run_attempt'],
                                               'conclusion': run['conclusion'], 'logs_sha256': hashlib.sha256((folder / 'provider-logs.zip').read_bytes()).hexdigest(),
                                               'jobs_accepted': all(rows[0]['status'] == 'completed' and rows[0]['conclusion'] == 'success' for rows in required.values()),
                                               'artifacts': retained})
              # Revalidate immediately before reporting; a later rerun cannot launder a
              # failed original, even if it completed while custody was being downloaded.
              for name, run in selected.items():
                  latest = json.loads(fetch(repository, f"actions/runs/{run['id']}"))
                  validate_run(latest, receipt['head'], receipt['branch'], receipt['event'], name,
                                config['producers'][name], config['producer_attempt'], repository, snapshot)
                  require(latest['status'] == 'completed' and latest['conclusion'] == run['conclusion'], 'Producer conclusion changed during capture')
                  row = next(row for row in receipt['producers'] if row['name'] == name)
                  require(workflow_revision(latest, config['producers'][name]['workflow'], repository, fetch,
                                            root / str(run['id']) / 'workflow-run-file-final.json', budget)
                          == row['workflow_revision'], 'Executed workflow revision changed during capture')
              receipt['source_workflow_sha256'] = source_hashes
              receipt['capture_budget'] = {'downloaded_bytes': budget.downloaded, 'retained_bytes': budget.retained,
                                           'expanded_bytes': budget.expanded, 'requests': budget.requests,
                                           'files': budget.files, 'archive_members': budget.members}
              receipt['capture_complete'] = True
              receipt['state'] = 'ready' if all(row['conclusion'] == 'success' and row['jobs_accepted'] for row in receipt['producers']) else 'failed'
              return receipt


          def write(path, value, budget=None):
              raw = (json.dumps(value, indent=2) + '\n').encode()
              if budget:
                  budget.retain(path, raw)
              else:
                  path.write_bytes(raw)


          def report(config, root):
              repository = repository_identity(config['repository'])
              fetch = CaptureBudget().request
              receipt = json.loads((root / 'receipt.json').read_text())
              require(receipt['repository'] == repository and receipt['policy'] == config, 'Reporting receipt policy differs')
              require(re.fullmatch(r'[0-9a-f]{40}', receipt['head']) and receipt['event'] in ['push', 'pull_request'], 'Invalid reporting target')
              snapshot = receipt['snapshot']
              require(snapshot['head'] == receipt['head'] and snapshot['target']['event'] == receipt['event']
                      and snapshot['target']['branch'] == receipt['branch']
                      and snapshot['target']['repository']['name'] == repository, 'Reporting target identity differs')
              context = status_context(config, snapshot['target'])
              require(receipt['status_context'] == context, 'Reporting context differs')
              if receipt['state'] == 'ready':
                  try:
                      require(len(receipt['producers']) == len(config['producers']), 'Reporting producer inventory differs')
                      for row in receipt['producers']:
                          latest = json.loads(fetch(repository, f"actions/runs/{row['run_id']}"))
                          validate_run(latest, receipt['head'], receipt['branch'], receipt['event'], row['name'],
                                       config['producers'][row['name']], config['producer_attempt'], repository, snapshot)
                          require(row['snapshot'] == snapshot, 'Reporting producer snapshot differs')
                          require(latest['status'] == 'completed' and latest['conclusion'] == row['conclusion'], 'Producer conclusion changed before reporting')
                          require(workflow_revision(latest, row['workflow'], repository, fetch)
                                  == row['workflow_revision'], 'Executed workflow revision changed before reporting')
                  except Exception as error:
                      receipt.update(state='failed', report_error=str(error))
                      write(root / 'report-failure.json', receipt)
              upload_ok = os.environ['SIMIT_CUSTODY_UPLOAD_OUTCOME'] == 'success' and os.environ['SIMIT_CUSTODY_ARTIFACT_ID'].isdigit()
              state = 'success' if receipt['state'] == 'ready' and receipt['capture_complete'] and upload_ok else 'pending' if receipt['state'] == 'waiting' and upload_ok else 'failure'
              identity = hashlib.sha256(json.dumps({'policy': config, 'producers': receipt['producers']}, sort_keys=True).encode()).hexdigest()[:16]
              try:
                  previous = pages(repository, f"commits/{receipt['head']}/status", 'statuses', fetch)
              except Exception as error:
                  # Deduplication is an optimization; it must never suppress revocation.
                  # An incomplete inventory also cannot establish a successful observation.
                  receipt.update(state='failed', status_lookup_error=str(error))
                  write(root / 'report-failure.json', receipt)
                  state, previous = 'failure', []
              description = f'Original-producer custody {state}: {identity}'
              current = next((status for status in previous if status['context'] == context), None)
              if current is None or current['state'] != state or current['description'] != description:
                  data = {'state': state, 'context': context, 'description': description,
                          'target_url': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
                  subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'POST',
                                  f"repos/{repository}/statuses/{receipt['head']}", '--input', '-'],
                                 input=json.dumps(data).encode(), check=True, timeout=90)
              return 1 if state == 'failure' else 0


          def main():
              config = json.loads(os.environ['SIMIT_CUSTODY_CONFIG'])
              phase = os.environ['SIMIT_CUSTODY_PHASE']
              with Path(os.environ['GITHUB_EVENT_PATH']).open('rb') as event:
                  payload_bytes = event.read(MAX_EVENT_BYTES + 1)
              require(len(payload_bytes) <= MAX_EVENT_BYTES, 'Completion event exceeds its bound')
              payload = json.loads(payload_bytes)
              # Classify before deriving a target, creating a root, retaining any bytes or
              # reading a prior receipt. Report repeats this fence after upload so an
              # unrelated completion can never publish through stale local custody.
              if unenrolled_completion(config, payload):
                  if phase == 'identity':
                      with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                          output.write('eligible=false\n')
                  return 0
              if os.environ['SIMIT_CUSTODY_PHASE'] == 'identity':
                  snapshot, _ = completion_identity(config, payload)
                  digest = hashlib.sha256(json.dumps(snapshot['target'], sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                  # Hex-only groups preserve case-sensitive refs despite case-insensitive
                  # Actions concurrency. Same-target pending replacements are observations
                  # of the same producer set; other branches/PRs/bases have distinct queues.
                  with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                      output.write('group=' + snapshot['head'] + '-' + digest + '\n')
                      output.write('eligible=true\n')
                  return 0
              root = Path(os.environ['SIMIT_CUSTODY_ROOT'])
              root.mkdir(exist_ok=True)
              if os.environ['SIMIT_CUSTODY_PHASE'] == 'report':
                  return report(config, root)
              budget = CaptureBudget()
              budget.retain(root / 'event.json', payload_bytes)
              try:
                  receipt = capture(config, payload, root, budget)
                  receipt['members'] = {}
                  for path in sorted(root.rglob('*')):
                      if path.is_file() and path.name != 'receipt.json':
                          with path.open('rb') as stream:
                              digest = hashlib.sha256()
                              while chunk := stream.read(65536):
                                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                                  digest.update(chunk)
                          receipt['members'][str(path.relative_to(root))] = digest.hexdigest()
                  write(root / 'receipt.json', receipt, budget)
              except Exception as error:
                  path = root / 'receipt.json'
                  if path.exists():
                      receipt = json.loads(path.read_text())
                      receipt.update(state='failed', error=str(error))
                      write(path, receipt)
                  raise
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
      - name: Upload completed-producer custody
        id: custody-upload
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: producer-custody-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.event }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 32
          if-no-files-found: error
          path: ${{ runner.temp }}/simit-producer-custody
      - name: Report custody on producer source head
        if: always()
        shell: python
        env:
          SIMIT_CUSTODY_ROOT: ${{ runner.temp }}/simit-producer-custody
          SIMIT_CUSTODY_PHASE: report
          SIMIT_CUSTODY_UPLOAD_OUTCOME: ${{ steps.custody-upload.outcome }}
          SIMIT_CUSTODY_ARTIFACT_ID: ${{ steps.custody-upload.outputs.artifact-id }}
        run: |
          """Observe completed originals. Never execute or extract producer-controlled data."""
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import queue
          import struct
          import subprocess
          import threading
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urlencode, quote, urlsplit, unquote

          MAX_BYTES = 512 * 1024 * 1024
          MAX_CAPTURE_BYTES = MAX_BYTES
          MAX_EXPANDED_BYTES = MAX_BYTES
          MAX_CAPTURE_REQUESTS = 256
          MAX_CAPTURE_FILES = 256
          MAX_ARCHIVE_MEMBERS = 10000
          MAX_DIRECTORY_BYTES = 16 * 1024 * 1024
          MAX_CAPTURE_SECONDS = 360
          MAX_EVENT_BYTES = 1024 * 1024


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def api(repository, endpoint, maximum=MAX_BYTES, timeout=90, query=None):
              """Bound downloads during receipt, including stalled pipes and diagnostics."""
              require(maximum >= 0 and timeout > 0, 'Capture budget exhausted')
              command = ['gh', 'api', '--allow-escape-sequences', '--hostname', 'github.com']
              if query is None:
                  command.append(f'repos/{repository}/{endpoint}')
              else:
                  require(endpoint == 'graphql', 'Invalid workflow-file proof endpoint')
                  command.extend(['graphql', '--method', 'POST', '--raw-field', 'query=' + query])
              deadline = time.monotonic() + timeout
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              events = queue.Queue(maxsize=4)
              stop = threading.Event()

              def receive(pipe, name):
                  try:
                      while not stop.is_set():
                          raw = os.read(pipe.fileno(), 65536)
                          while not stop.is_set():
                              try:
                                  events.put((name, raw), timeout=0.1)
                                  break
                              except queue.Full:
                                  pass
                          if not raw:
                              return
                  except Exception as error:
                      while not stop.is_set():
                          try:
                              events.put((name, error), timeout=0.1)
                              return
                          except queue.Full:
                              pass

              with subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE) as process:
                  readers = [threading.Thread(target=receive, args=(pipe, name), daemon=True, name='custody-download-' + name)
                             for pipe, name in [(process.stdout, 'stdout'), (process.stderr, 'stderr')]]
                  for reader in readers:
                      reader.start()
                  try:
                      completed = set()
                      while len(completed) < 2:
                          remaining = deadline - time.monotonic()
                          require(remaining > 0, 'Provider download timed out')
                          try:
                              name, chunk = events.get(timeout=remaining)
                          except queue.Empty as error:
                              raise RuntimeError('Provider download timed out') from error
                          if isinstance(chunk, Exception):
                              raise chunk
                          limit = maximum if name == 'stdout' else 65536
                          require(len(buffers[name]) + len(chunk) <= limit, 'Provider response exceeds capture budget')
                          if chunk:
                              buffers[name].extend(chunk)
                          else:
                              completed.add(name)
                      status = process.wait(timeout=max(0, deadline - time.monotonic()))
                      if status:
                          raise subprocess.CalledProcessError(status, command, stderr=bytes(buffers['stderr']))
                  finally:
                      stop.set()
                      if process.poll() is None:
                          process.kill()
                      process.wait(timeout=5)
                      for reader in readers:
                          reader.join(timeout=1)
                      require(not any(reader.is_alive() for reader in readers), 'Provider pipe reader did not stop')
              return bytes(buffers['stdout'])


          class CaptureBudget:
              def __init__(self):
                  self.downloaded = self.retained = self.expanded = 0
                  self.requests = self.files = self.members = 0
                  self.deadline = time.monotonic() + MAX_CAPTURE_SECONDS

              def request(self, repository, endpoint, query=None):
                  self.requests += 1
                  require(self.requests <= MAX_CAPTURE_REQUESTS, 'Capture request inventory exceeds its bound')
                  remaining = self.deadline - time.monotonic()
                  require(remaining > 0, 'Aggregate capture deadline exceeded')
                  options = {'query': query} if query is not None else {}
                  raw = api(repository, endpoint, maximum=min(MAX_BYTES, MAX_CAPTURE_BYTES - self.downloaded),
                            timeout=min(90, remaining), **options)
                  self.downloaded += len(raw)
                  require(self.downloaded <= MAX_CAPTURE_BYTES, 'Aggregate download budget exceeded')
                  return raw

              def retain(self, path, raw):
                  self.files += 1
                  self.retained += len(raw)
                  require(self.files <= MAX_CAPTURE_FILES and self.retained <= MAX_CAPTURE_BYTES,
                          'Aggregate retained custody budget exceeded')
                  path.write_bytes(raw)

              def archive(self, entries):
                  self.members += len(entries)
                  self.expanded += sum(entry.file_size for entry in entries)
                  require(self.members <= MAX_ARCHIVE_MEMBERS and self.expanded <= MAX_EXPANDED_BYTES,
                          'Aggregate archive expansion budget exceeded')


          def repository_identity(value):
              require(isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', value),
                      'Invalid repository identity')
              return value.lower()


          def branch_identity(value):
              require(isinstance(value, str) and 0 < len(value.encode()) <= 1024
                      and not any(ord(character) < 32 or ord(character) == 127 for character in value),
                      'Invalid branch identity')
              return hashlib.sha256(value.encode()).hexdigest()


          def pages(repository, endpoint, key, fetch=None):
              collected, total = [], None
              for page in range(1, 21):
                  separator = '&' if '?' in endpoint else '?'
                  response = json.loads((fetch or api)(repository, f'{endpoint}{separator}per_page=100&page={page}'))
                  count = response['total_count']
                  require(type(count) is int and 0 <= count <= 2000, 'Provider inventory exceeds its bound')
                  require(total is None or total == count, 'Provider inventory changed during collection')
                  total = count
                  rows = response[key]
                  require(isinstance(rows, list) and len(rows) == min(100, total - len(collected)), 'Provider page is incomplete')
                  collected.extend(rows)
                  if len(collected) == total:
                      return collected
              raise RuntimeError('Provider inventory exceeds bounded collection')


          def zip_inventory(raw, budget):
              """Bound actual directory records before ZipFile eagerly creates ZipInfo objects.

              Match CPython zipfile's _EndRecData/_RealGetContents framing, including
              concatenated archives and ZIP64 end records. _EndRecData reads only the
              bounded EOCD tail and fixed ZIP64 records; it never parses member inventory.
              """
              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
              end = zipfile._EndRecData(io.BytesIO(raw))
              require(end is not None, 'Missing archive directory footer')
              require(end[zipfile._ECD_DISK_NUMBER] == end[zipfile._ECD_DISK_START] == 0
                      and end[zipfile._ECD_ENTRIES_THIS_DISK] == end[zipfile._ECD_ENTRIES_TOTAL],
                      'Unsupported split archive')
              size = end[zipfile._ECD_SIZE]
              stop = end[zipfile._ECD_LOCATION]
              if end[zipfile._ECD_SIGNATURE] == zipfile.stringEndArchive64:
                  # 3.12 returns the classic EOCD location; 3.14 returns the ZIP64 record
                  # location (and supports extensible data). Use the actual footer framing.
                  if raw[stop:stop + 4] == zipfile.stringEndArchive:
                      stop -= zipfile.sizeEndCentDir64 + zipfile.sizeEndCentDir64Locator
                  require(raw[stop:stop + 4] == zipfile.stringEndArchive64, 'Invalid ZIP64 directory footer')
              position = stop - size
              require(0 <= size <= MAX_DIRECTORY_BYTES and 0 <= position <= stop <= len(raw)
                      and 0 <= end[zipfile._ECD_OFFSET] <= position,
                      'Archive directory exceeds custody bounds')
              count = expanded = 0
              while position < stop:
                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                  require(position + zipfile.sizeCentralDir <= stop, 'Truncated archive directory record')
                  header = struct.unpack_from(zipfile.structCentralDir, raw, position)
                  require(header[zipfile._CD_SIGNATURE] == zipfile.stringCentralDir, 'Invalid archive directory record')
                  require(header[zipfile._CD_COMPRESS_TYPE] in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                          'Unsupported custody compression method')
                  count += 1
                  require(budget.members + count <= MAX_ARCHIVE_MEMBERS, 'Aggregate archive member budget exceeded')
                  extra_start = position + zipfile.sizeCentralDir + header[zipfile._CD_FILENAME_LENGTH]
                  extra_end = extra_start + header[zipfile._CD_EXTRA_FIELD_LENGTH]
                  next_position = extra_end + header[zipfile._CD_COMMENT_LENGTH]
                  require(next_position <= stop, 'Truncated archive directory fields')
                  file_size = header[zipfile._CD_UNCOMPRESSED_SIZE]
                  cursor = extra_start
                  while cursor < extra_end:
                      require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                      require(cursor + 4 <= extra_end, 'Truncated archive extra field')
                      kind, length = struct.unpack_from('<HH', raw, cursor)
                      cursor += 4
                      require(cursor + length <= extra_end, 'Truncated archive extra field')
                      if kind == 1 and file_size == 0xffffffff:
                          require(length >= 8, 'Missing ZIP64 member size')
                          file_size = struct.unpack_from('<Q', raw, cursor)[0]
                      cursor += length
                  require(file_size != 0xffffffff, 'Missing ZIP64 member size')
                  expanded += file_size
                  require(expanded <= MAX_BYTES and budget.expanded + expanded <= MAX_EXPANDED_BYTES,
                          'Aggregate archive expansion budget exceeded')
                  position = next_position
              require(count == end[zipfile._ECD_ENTRIES_TOTAL], 'Archive directory count differs')
              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
              return count, expanded


          def zip_members(raw, budget=None):
              require(len(raw) <= MAX_BYTES, 'Archive exceeds custody budget')
              budget = budget or CaptureBudget()
              count, expanded = zip_inventory(raw, budget)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                  entries = archive.infolist()
                  require(len(entries) == count and sum(entry.file_size for entry in entries) == expanded,
                          'Archive directory interpretation differs')
                  budget.archive(entries)
                  names = [entry.filename for entry in entries]
                  require(len(names) == len(set(names)), 'Duplicate archive members')
                  require(sum(entry.file_size for entry in entries) <= MAX_BYTES, 'Expanded archive exceeds custody budget')
                  for name in names:
                      require(not name.startswith('/') and '..' not in Path(name).parts, 'Unsafe archive member')
                  members = {}
                  for entry in entries:
                      require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                      if entry.is_dir():
                          continue
                      digest = hashlib.sha256()
                      read_bytes = 0
                      with archive.open(entry) as stream:
                          while True:
                              require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                              chunk = stream.read(65536)
                              if not chunk:
                                  break
                              read_bytes += len(chunk)
                              require(read_bytes <= entry.file_size, 'Archive member exceeds admitted size')
                              digest.update(chunk)
                      require(read_bytes == entry.file_size, 'Archive member size differs')
                      members[entry.filename] = digest.hexdigest()
                  return members


          def run_identity(run, repository):
              """Separate a stable status target from provider-observed admission snapshots.

              PR association SHAs are observed API data, not historical base-execution
              provenance. Ambiguous/missing associations never fall back to a branch target.
              """
              def positive(value):
                  require(type(value) is int and value > 0, 'Invalid repository or PR identity')
                  return value
              def sha(value):
                  require(isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value), 'Invalid observed source SHA')
                  return value
              repo, head_repo = run['repository'], run['head_repository']
              require(repository_identity(repo['full_name']) == repository
                      == repository_identity(head_repo['full_name']), 'Producer repository differs or requires fork enrollment')
              repo_id, head_id = positive(repo['id']), positive(head_repo['id'])
              require(repo_id == head_id, 'Producer repository IDs differ')
              event = run['event']
              require(event in ['push', 'pull_request'], 'Unsupported completion event')
              branch = run['head_branch']
              branch_identity(branch)
              head = sha(run['head_sha'])
              target = {'repository': {'id': repo_id, 'name': repository}, 'event': event,
                        'head_repository': {'id': head_id, 'name': repository}, 'branch': branch}
              base = None
              if event == 'pull_request':
                  associations = run.get('pull_requests')
                  require(isinstance(associations, list) and len(associations) == 1,
                          'PR custody requires one unambiguous provider association')
                  pr = associations[0]
                  number, pr_id = positive(pr['number']), positive(pr['id'])
                  require(isinstance(pr['url'], str) and pr['url'].lower()
                          == f'https://api.github.com/repos/{repository}/pulls/{number}', 'PR target URL differs')
                  require(positive(pr['head']['repo']['id']) == head_id
                          and positive(pr['base']['repo']['id']) == repo_id, 'PR repository IDs differ')
                  require(pr['head']['ref'] == branch and sha(pr['head']['sha']) == head, 'PR observed head differs')
                  base_ref = pr['base']['ref']
                  branch_identity(base_ref)
                  base = sha(pr['base']['sha'])
                  target['pull_request'] = {'id': pr_id, 'number': number,
                                            'base_repository_id': repo_id, 'base_ref': base_ref}
              return {'target': target, 'head': head, 'observed_base_sha': base}


          def status_context(config, target):
              digest = hashlib.sha256(json.dumps(target, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              context = config['status_context'] + '/' + target['event'] + '/' + digest
              # Simit's bounded composed-context contract, enforced independently of the
              # provider's response so failure revocation uses an admitted status target.
              require(config['status_context'] and len(context.encode()) <= 100
                      and not any(ord(character) < 32 or ord(character) == 127 for character in context),
                      'Composed custody status context exceeds its bound')
              return context


          def completion_identity(config, payload):
              repository = repository_identity(config['repository'])
              require(os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'Custody requires a hosted collector')
              require(repository == repository_identity(os.environ['GITHUB_REPOSITORY'])
                      == repository_identity(payload['repository']['full_name']), 'Collector repository differs')
              run = payload['workflow_run']
              require(type(run['id']) is int and run['id'] > 0, 'Invalid completion run identity')
              snapshot = run_identity(run, repository)
              require(type(payload['repository']['id']) is int
                      and payload['repository']['id'] == snapshot['target']['repository']['id'], 'Collector repository ID differs')
              return snapshot, status_context(config, snapshot['target'])


          def workflow_path_matches(value, expected, snapshot):
              """Accept provider ref qualifications only for the observed source target."""
              if not isinstance(value, str):
                  return False
              path, separator, reference = value.partition('@')
              target = snapshot['target']
              references = {snapshot['head'], target['branch'], 'refs/heads/' + target['branch']}
              if target['event'] == 'pull_request':
                  number = target['pull_request']['number']
                  references.update({f'refs/pull/{number}/head', f'refs/pull/{number}/merge'})
              return path == expected and (not separator or reference in references)


          def unenrolled_completion(config, payload):
              """Only a positively identified, different file is outside enrollment.

              Names are not unique on GitHub. Keep enrolled files (including wrong names
              or ref qualifiers) on the normal fail/revoke path; malformed paths cannot
              establish that a completion is unrelated either.
              """
              run = payload.get('workflow_run')
              value = run.get('path') if isinstance(run, dict) else None
              if not isinstance(value, str):
                  return False
              path = value.partition('@')[0]
              return (re.fullmatch(r'\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml', path) is not None
                      and path not in {producer['workflow'] for producer in config['producers'].values()})


          def validate_run(run, head, branch, event, name, producer, attempt, repository, snapshot):
              require(type(run['id']) is int and run['id'] > 0, 'Invalid producer run identity')
              require(repository_identity(run['repository']['full_name']) == repository, 'Producer repository differs')
              require(repository_identity(run['head_repository']['full_name']) == repository, 'Fork custody requires separate enrollment')
              require(run['head_sha'] == head and run['head_branch'] == branch, 'Producer source differs')
              require(run['event'] == event and workflow_path_matches(run['path'], producer['workflow'], snapshot)
                      and run['name'] == name, 'Producer workflow or event differs')
              require(run['run_attempt'] == attempt, 'Latest producer attempt is not the enrolled original')
              require(run_identity(run, repository) == snapshot, 'Producer target or observed snapshot differs')


          def workflow_revision(run, workflow, repository, fetch, proof_path=None, budget=None):
              """Bind the executed file, independently of source head or checkout revision.

              GitHub's documented WorkflowRunFile is the executed workflow file and its
              repositoryFileUrl links to that file. Only immutable commit URLs are proof:
              https://docs.github.com/en/graphql/reference/actions#workflowrunfile
              REST head_sha, referenced reusable workflows, logs and today's merge ref do
              not identify the historical top-level workflow definition.
              """
              node_id = run.get('node_id')
              require(isinstance(node_id, str) and 0 < len(node_id) <= 256, 'Missing native workflow run node identity')
              query = ('query { node(id: ' + json.dumps(node_id) + ') { ... on WorkflowRun { '
                       'id databaseId runAttempt event checkSuite { databaseId repository { databaseId nameWithOwner } } '
                       'file { path repositoryName repositoryFileUrl run { id databaseId runAttempt } } } } }')
              raw = fetch(repository, 'graphql', query=query)
              if proof_path is not None:
                  budget.retain(proof_path, raw)
              response = json.loads(raw)
              require(isinstance(response, dict) and not response.get('errors')
                      and isinstance(response.get('data'), dict), 'Native workflow-file proof query failed')
              node = response['data'].get('node')
              require(isinstance(node, dict) and node.get('id') == node_id, 'Native workflow run node differs')
              suite = node['checkSuite']
              for actual, expected in [(node['databaseId'], run['id']), (node['runAttempt'], run['run_attempt']),
                                       (suite['databaseId'], run['check_suite_id']),
                                       (suite['repository']['databaseId'], run['repository']['id'])]:
                  require(type(actual) is int and type(expected) is int and actual > 0 and actual == expected,
                          'Native workflow-file run identity differs')
              require(node['event'] == run['event']
                      and repository_identity(suite['repository']['nameWithOwner']) == repository,
                      'Native workflow-file event or repository differs')
              file = node['file']
              require(isinstance(file, dict), 'Historical executed workflow file proof unavailable')
              require(file['path'] == workflow and repository_identity(file['repositoryName']) == repository,
                      'Executed workflow file or repository differs')
              parent = file['run']
              require(parent['id'] == node_id and type(parent['databaseId']) is int and parent['databaseId'] == run['id']
                      and type(parent['runAttempt']) is int and parent['runAttempt'] == run['run_attempt'],
                      'Executed workflow file belongs to another run or attempt')
              require(isinstance(file['repositoryFileUrl'], str), 'Missing executed workflow file URL')
              url = urlsplit(file['repositoryFileUrl'])
              parts = url.path.split('/', 5)
              require(url.scheme == 'https' and url.netloc == 'github.com' and not url.query and not url.fragment
                      and len(parts) == 6 and parts[3] == 'blob', 'Invalid executed workflow file URL')
              require(repository_identity(unquote(parts[1]) + '/' + unquote(parts[2])) == repository
                      and re.fullmatch(r'[0-9a-f]{40}', parts[4]) and unquote(parts[5]) == workflow,
                      'Executed workflow file URL is not an immutable enrolled revision')
              return {'commit': parts[4], 'workflow': workflow, 'repository': repository,
                      'repository_id': run['repository']['id'], 'node_id': node_id,
                      'run_id': run['id'], 'attempt': run['run_attempt'], 'check_suite_id': run['check_suite_id']}


          def capture(config, payload, root, budget=None):
              if unenrolled_completion(config, payload):
                  return None
              repository = repository_identity(config['repository'])
              budget = budget or CaptureBudget()
              fetch = budget.request
              require(os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'Custody requires a hosted collector')
              require(repository == repository_identity(os.environ['GITHUB_REPOSITORY'])
                      == repository_identity(payload['repository']['full_name']), 'Collector repository differs')
              event_run = payload['workflow_run']
              require(type(event_run['id']) is int and event_run['id'] > 0, 'Invalid completion run identity')
              require(repository_identity(event_run['head_repository']['full_name']) == repository, 'Completion source repository differs')
              require(re.fullmatch(r'[0-9a-f]{40}', event_run['head_sha']), 'Invalid completion source head')
              require(event_run['event'] in ['push', 'pull_request'], 'Unsupported completion event')
              branch_identity(event_run['head_branch'])
              snapshot, context = completion_identity(config, payload)
              receipt = {'schema': 'simit.producer-custody.v1', 'repository': repository,
                         'head': event_run['head_sha'], 'branch': event_run['head_branch'], 'event': event_run['event'],
                         'state': 'waiting', 'qualified': False, 'observation_is_execution': False,
                         'capture_complete': False, 'producers': [], 'policy': config,
                         'snapshot': snapshot, 'status_context': context,
                         'collector_head': os.environ['GITHUB_SHA'], 'collector_run': os.environ['GITHUB_RUN_ID'],
                         'collector_attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
              write(root / 'receipt.json', receipt)
              # Retain the safely established reporting target before querying/admitting
              # attempts, so rejected reruns and provider failures revoke prior success.
              trigger = json.loads(fetch(repository, f"actions/runs/{event_run['id']}"))
              require(trigger['event'] in ['push', 'pull_request'] and trigger['status'] == 'completed', 'Trigger is not an eligible completion')
              for key in ['head_sha', 'event', 'head_branch', 'run_attempt']:
                  require(trigger[key] == event_run[key], 'Completion event changed')
              require(trigger['name'] in config['producers'], 'Trigger workflow is not enrolled')
              require(workflow_path_matches(event_run['path'], config['producers'][trigger['name']]['workflow'], snapshot),
                      'Completion workflow path differs')
              validate_run(trigger, receipt['head'], receipt['branch'], receipt['event'],
                           trigger['name'], config['producers'][trigger['name']], config['producer_attempt'], repository, snapshot)
              receipt['trigger_snapshot'] = run_identity(trigger, repository)
              # workflow_run fires when either enrolled workflow completes. A missing or
              # incomplete sibling stays pending until its own completion event arrives.
              candidates = pages(repository, 'actions/runs?' + urlencode({'head_sha': receipt['head'],
                                 'event': receipt['event']}), 'workflow_runs', fetch)
              write(root / 'discovery.json', candidates, budget)
              selected = {}
              for name, producer in config['producers'].items():
                  matching = []
                  for candidate in candidates:
                      if (not workflow_path_matches(candidate['path'], producer['workflow'], snapshot)
                              or candidate['head_branch'] != receipt['branch']
                              or candidate['event'] != receipt['event'] or candidate['head_sha'] != receipt['head']):
                          continue
                      identity = run_identity(candidate, repository)
                      if identity['target'] != snapshot['target']:
                          continue
                      require(identity == snapshot, 'Sibling observed snapshot differs')
                      matching.append(candidate)
                  require(len(matching) <= 1, 'Duplicate original producer identity')
                  if not matching:
                      return receipt
                  run = json.loads(fetch(repository, f"actions/runs/{matching[0]['id']}"))
                  validate_run(run, receipt['head'], receipt['branch'], receipt['event'], name,
                                producer, config['producer_attempt'], repository, snapshot)
                  selected[name] = run
              if any(run['status'] != 'completed' for run in selected.values()):
                  return receipt
              commit = json.loads(fetch(repository, f"git/commits/{receipt['head']}"))
              require(commit['sha'] == receipt['head'], 'Source commit differs')
              receipt['tree'] = commit['tree']['sha']
              source_hashes = {}
              for name, producer in config['producers'].items():
                  run = selected[name]
                  folder = root / str(run['id'])
                  folder.mkdir()
                  write(folder / 'terminal.json', run, budget)
                  revision = workflow_revision(run, producer['workflow'], repository, fetch,
                                               folder / 'workflow-run-file.json', budget)
                  raw_commit = fetch(repository, f"git/commits/{revision['commit']}")
                  budget.retain(folder / 'workflow-commit.json', raw_commit)
                  workflow_commit = json.loads(raw_commit)
                  require(workflow_commit['sha'] == revision['commit']
                          and re.fullmatch(r'[0-9a-f]{40}', workflow_commit['tree']['sha']), 'Workflow commit or tree differs')
                  raw_source = fetch(repository, 'contents/' + quote(producer['workflow'], safe='/')
                                     + '?ref=' + revision['commit'])
                  budget.retain(folder / 'workflow-content.json', raw_source)
                  source = json.loads(raw_source)
                  require(source['encoding'] == 'base64' and source['type'] == 'file', 'Invalid enrolled workflow content')
                  raw = base64.b64decode(source['content'], validate=False)
                  require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == source['sha'], 'Workflow Git blob checksum differs')
                  budget.retain(folder / 'workflow.yaml', raw)
                  workflow_checksum = hashlib.sha256(raw).hexdigest()
                  source_hashes[producer['workflow']] = workflow_checksum
                  jobs = pages(repository, f"actions/runs/{run['id']}/attempts/{config['producer_attempt']}/jobs", 'jobs', fetch)
                  write(folder / 'jobs.json', jobs, budget)
                  required = {job_name: [job for job in jobs if job['name'] == job_name] for job_name in producer['jobs']}
                  require(all(len(rows) == 1 for rows in required.values()), 'Missing or duplicate enrolled jobs')
                  require(all(job['run_id'] == run['id'] and job['head_sha'] == receipt['head']
                             and job['run_attempt'] == config['producer_attempt'] for job in jobs), 'Job source or attempt differs')
                  job_logs = []
                  for job_name, rows in required.items():
                      job = rows[0]
                      require(type(job['id']) is int and job['id'] > 0, 'Invalid enrolled job identity')
                      log = fetch(repository, f"actions/jobs/{job['id']}/logs")
                      require(log and len(log) <= MAX_BYTES, 'Missing or oversized enrolled-job provider log')
                      budget.retain(folder / f"job-{job['id']}.log", log)
                      job_logs.append({'id': job['id'], 'name': job_name, 'sha256': hashlib.sha256(log).hexdigest()})
                  raw = fetch(repository, f"actions/runs/{run['id']}/attempts/{config['producer_attempt']}/logs")
                  members = zip_members(raw, budget)
                  budget.retain(folder / 'provider-logs.zip', raw)
                  require(members or run['conclusion'] != 'success', 'Successful producer has no provider logs')
                  write(folder / 'provider-log-members.json', members, budget)
                  artifacts = pages(repository, f"actions/runs/{run['id']}/artifacts", 'artifacts', fetch)
                  write(folder / 'artifacts.json', artifacts, budget)
                  retained = []
                  for artifact_name in producer['artifacts']:
                      matching = [artifact for artifact in artifacts if artifact['name'] == artifact_name]
                      require(len(matching) == 1, 'Missing or duplicate enrolled artifacts')
                      artifact = matching[0]
                      require(type(artifact['id']) is int and artifact['id'] > 0 and artifact['expired'] is False, 'Invalid or expired enrolled artifact')
                      require(artifact['size_in_bytes'] <= MAX_BYTES, 'Enrolled artifact exceeds custody budget')
                      require(artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == receipt['head'], 'Artifact source or run differs')
                      raw = fetch(repository, f"actions/artifacts/{artifact['id']}/zip")
                      checksum = hashlib.sha256(raw).hexdigest()
                      if artifact.get('digest') is not None:
                          require(artifact['digest'] == 'sha256:' + checksum, 'Provider artifact checksum differs')
                      members = zip_members(raw, budget)
                      budget.retain(folder / f"artifact-{artifact['id']}.zip", raw)
                      retained.append({'id': artifact['id'], 'name': artifact_name, 'sha256': checksum,
                                       'members': members})
                  receipt['producers'].append({'run_id': run['id'], 'workflow': producer['workflow'],
                                                'workflow_revision': revision, 'workflow_tree': workflow_commit['tree']['sha'],
                                                'source_workflow_sha256': workflow_checksum,
                                                'name': name, 'job_logs': job_logs, 'snapshot': run_identity(run, repository),
                                               'event': run['event'], 'attempt': run['run_attempt'],
                                               'conclusion': run['conclusion'], 'logs_sha256': hashlib.sha256((folder / 'provider-logs.zip').read_bytes()).hexdigest(),
                                               'jobs_accepted': all(rows[0]['status'] == 'completed' and rows[0]['conclusion'] == 'success' for rows in required.values()),
                                               'artifacts': retained})
              # Revalidate immediately before reporting; a later rerun cannot launder a
              # failed original, even if it completed while custody was being downloaded.
              for name, run in selected.items():
                  latest = json.loads(fetch(repository, f"actions/runs/{run['id']}"))
                  validate_run(latest, receipt['head'], receipt['branch'], receipt['event'], name,
                                config['producers'][name], config['producer_attempt'], repository, snapshot)
                  require(latest['status'] == 'completed' and latest['conclusion'] == run['conclusion'], 'Producer conclusion changed during capture')
                  row = next(row for row in receipt['producers'] if row['name'] == name)
                  require(workflow_revision(latest, config['producers'][name]['workflow'], repository, fetch,
                                            root / str(run['id']) / 'workflow-run-file-final.json', budget)
                          == row['workflow_revision'], 'Executed workflow revision changed during capture')
              receipt['source_workflow_sha256'] = source_hashes
              receipt['capture_budget'] = {'downloaded_bytes': budget.downloaded, 'retained_bytes': budget.retained,
                                           'expanded_bytes': budget.expanded, 'requests': budget.requests,
                                           'files': budget.files, 'archive_members': budget.members}
              receipt['capture_complete'] = True
              receipt['state'] = 'ready' if all(row['conclusion'] == 'success' and row['jobs_accepted'] for row in receipt['producers']) else 'failed'
              return receipt


          def write(path, value, budget=None):
              raw = (json.dumps(value, indent=2) + '\n').encode()
              if budget:
                  budget.retain(path, raw)
              else:
                  path.write_bytes(raw)


          def report(config, root):
              repository = repository_identity(config['repository'])
              fetch = CaptureBudget().request
              receipt = json.loads((root / 'receipt.json').read_text())
              require(receipt['repository'] == repository and receipt['policy'] == config, 'Reporting receipt policy differs')
              require(re.fullmatch(r'[0-9a-f]{40}', receipt['head']) and receipt['event'] in ['push', 'pull_request'], 'Invalid reporting target')
              snapshot = receipt['snapshot']
              require(snapshot['head'] == receipt['head'] and snapshot['target']['event'] == receipt['event']
                      and snapshot['target']['branch'] == receipt['branch']
                      and snapshot['target']['repository']['name'] == repository, 'Reporting target identity differs')
              context = status_context(config, snapshot['target'])
              require(receipt['status_context'] == context, 'Reporting context differs')
              if receipt['state'] == 'ready':
                  try:
                      require(len(receipt['producers']) == len(config['producers']), 'Reporting producer inventory differs')
                      for row in receipt['producers']:
                          latest = json.loads(fetch(repository, f"actions/runs/{row['run_id']}"))
                          validate_run(latest, receipt['head'], receipt['branch'], receipt['event'], row['name'],
                                       config['producers'][row['name']], config['producer_attempt'], repository, snapshot)
                          require(row['snapshot'] == snapshot, 'Reporting producer snapshot differs')
                          require(latest['status'] == 'completed' and latest['conclusion'] == row['conclusion'], 'Producer conclusion changed before reporting')
                          require(workflow_revision(latest, row['workflow'], repository, fetch)
                                  == row['workflow_revision'], 'Executed workflow revision changed before reporting')
                  except Exception as error:
                      receipt.update(state='failed', report_error=str(error))
                      write(root / 'report-failure.json', receipt)
              upload_ok = os.environ['SIMIT_CUSTODY_UPLOAD_OUTCOME'] == 'success' and os.environ['SIMIT_CUSTODY_ARTIFACT_ID'].isdigit()
              state = 'success' if receipt['state'] == 'ready' and receipt['capture_complete'] and upload_ok else 'pending' if receipt['state'] == 'waiting' and upload_ok else 'failure'
              identity = hashlib.sha256(json.dumps({'policy': config, 'producers': receipt['producers']}, sort_keys=True).encode()).hexdigest()[:16]
              try:
                  previous = pages(repository, f"commits/{receipt['head']}/status", 'statuses', fetch)
              except Exception as error:
                  # Deduplication is an optimization; it must never suppress revocation.
                  # An incomplete inventory also cannot establish a successful observation.
                  receipt.update(state='failed', status_lookup_error=str(error))
                  write(root / 'report-failure.json', receipt)
                  state, previous = 'failure', []
              description = f'Original-producer custody {state}: {identity}'
              current = next((status for status in previous if status['context'] == context), None)
              if current is None or current['state'] != state or current['description'] != description:
                  data = {'state': state, 'context': context, 'description': description,
                          'target_url': f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
                  subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'POST',
                                  f"repos/{repository}/statuses/{receipt['head']}", '--input', '-'],
                                 input=json.dumps(data).encode(), check=True, timeout=90)
              return 1 if state == 'failure' else 0


          def main():
              config = json.loads(os.environ['SIMIT_CUSTODY_CONFIG'])
              phase = os.environ['SIMIT_CUSTODY_PHASE']
              with Path(os.environ['GITHUB_EVENT_PATH']).open('rb') as event:
                  payload_bytes = event.read(MAX_EVENT_BYTES + 1)
              require(len(payload_bytes) <= MAX_EVENT_BYTES, 'Completion event exceeds its bound')
              payload = json.loads(payload_bytes)
              # Classify before deriving a target, creating a root, retaining any bytes or
              # reading a prior receipt. Report repeats this fence after upload so an
              # unrelated completion can never publish through stale local custody.
              if unenrolled_completion(config, payload):
                  if phase == 'identity':
                      with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                          output.write('eligible=false\n')
                  return 0
              if os.environ['SIMIT_CUSTODY_PHASE'] == 'identity':
                  snapshot, _ = completion_identity(config, payload)
                  digest = hashlib.sha256(json.dumps(snapshot['target'], sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                  # Hex-only groups preserve case-sensitive refs despite case-insensitive
                  # Actions concurrency. Same-target pending replacements are observations
                  # of the same producer set; other branches/PRs/bases have distinct queues.
                  with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                      output.write('group=' + snapshot['head'] + '-' + digest + '\n')
                      output.write('eligible=true\n')
                  return 0
              root = Path(os.environ['SIMIT_CUSTODY_ROOT'])
              root.mkdir(exist_ok=True)
              if os.environ['SIMIT_CUSTODY_PHASE'] == 'report':
                  return report(config, root)
              budget = CaptureBudget()
              budget.retain(root / 'event.json', payload_bytes)
              try:
                  receipt = capture(config, payload, root, budget)
                  receipt['members'] = {}
                  for path in sorted(root.rglob('*')):
                      if path.is_file() and path.name != 'receipt.json':
                          with path.open('rb') as stream:
                              digest = hashlib.sha256()
                              while chunk := stream.read(65536):
                                  require(time.monotonic() < budget.deadline, 'Aggregate capture deadline exceeded')
                                  digest.update(chunk)
                          receipt['members'][str(path.relative_to(root))] = digest.hexdigest()
                  write(root / 'receipt.json', receipt, budget)
              except Exception as error:
                  path = root / 'receipt.json'
                  if path.exists():
                      receipt = json.loads(path.read_text())
                      receipt.update(state='failed', error=str(error))
                      write(path, receipt)
                  raise
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
