[package]
name = "canix-toolbelt-roborev-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded Linux preparation, admission and offline execution for Roborev controllers"
license = "MIT"
repository = "https://github.com/caniko/canix-toolbelt"
documentation = "https://docs.rs/canix-toolbelt-roborev-worker"
keywords = ["roborev", "review", "linux", "isolation"]
categories = ["development-tools", "os::linux-apis"]
readme = "README.md"
include = ["/src/**", "/tests/**", "/README.md", "/CHANGELOG.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

# Independent Linux package: the portable Toolbelt library keeps forbidding
# unsafe code and does not require a Linux worker to consume review contracts.
[workspace]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[features]
default = []
roborev-preparation-tests = []
roborev-execution-tests = []
roborev-worker-tests = []

[[bin]]
name = "roborev-worker"
path = "src/main.rs"

[[bin]]
name = "roborev-preparation-fixture"
path = "src/bin/roborev-preparation-fixture.rs"
required-features = ["roborev-preparation-tests"]

[[bin]]
name = "roborev-execution-fixture"
path = "src/bin/roborev-execution-fixture.rs"
required-features = ["roborev-execution-tests"]

[[bin]]
name = "roborev-admission-fixture"
path = "src/bin/roborev-admission-fixture.rs"
required-features = ["roborev-execution-tests"]

[[bin]]
name = "roborev-worker-fixture"
path = "src/bin/roborev-worker-fixture.rs"
required-features = ["roborev-worker-tests"]

[[test]]
name = "roborev_preparation"
required-features = ["roborev-preparation-tests"]

[[test]]
name = "roborev_execution"
required-features = ["roborev-execution-tests"]

[[test]]
name = "roborev_peer"
required-features = ["roborev-execution-tests"]

[[test]]
name = "roborev_admission_concurrent"
required-features = ["roborev-execution-tests"]

[[test]]
name = "roborev_admission_durability"
required-features = ["roborev-execution-tests"]

[[test]]
name = "roborev_offline_worker"
required-features = ["roborev-worker-tests"]

[dependencies]
anyhow = "1"
getrandom = "0.3"
nix = { version = "0.31", features = ["fs", "user", "signal", "resource", "socket", "mount", "feature", "poll"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
