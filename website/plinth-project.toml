[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Composable NixOS modules"
description = "CPU microcode, GPU vendor stacks, EFI and btrfs defaults, PipeWire, fwupd, boot assessment and a hardware watchdog, each small enough to import on its own instead of as a bundle."

[[pages.sections.features]]
title = "Flake-parts modules with checks"
description = "Modules for treefmt-nix, git hooks and host-output selection, plus a ripgrep-based structure check whose rules, paths and globs stay owned by the consuming repository."

[[pages.sections.features]]
title = "Cloud-host configurator"
description = "cloud-host composes a complete small guest with Disko and NetworkManager: UEFI or BIOS, a fixed Btrfs subvolume layout with separate state and identity, weekly scrub and daily root snapshots."

[[pages.sections.features]]
title = "Site plumbing"
description = "mkSite helpers publish Zola sites, mdBook docs, combined static trees and Codeberg Pages deploy apps, so a repository does not carry its own copy of that wiring."

[[pages.sections]]
type = "install"
id = "install"
heading = "Install"
intro = "Add the flake input and import the modules you need; the consuming flake keeps its own host metadata, secrets and policy. The optional CLI ships as a crate feature for review and merge work."
guide_href = "https://github.com/caniko/canix-toolbelt"

[[pages.sections.primary_routes]]
label = "Flake input"
audience = "Any flake that builds NixOS hosts"
command = 'canix-toolbelt.url = "git+ssh://git@github.com/caniko/canix-toolbelt.git";'
href = "https://github.com/caniko/canix-toolbelt#module-composition"
recommended = true

[[pages.sections.secondary_routes]]
label = "Review and merge CLI"
audience = "A Rust toolchain, from crates.io"
command = "cargo install canix-toolbelt --features cli"
href = "https://github.com/caniko/canix-toolbelt/blob/trunk/RUST.md"
